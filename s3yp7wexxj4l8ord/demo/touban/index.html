<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>【体験版】みんながグリンピースさん体験版</title>
<style id="gp-css">:root{
  --bg:#0A1122; --bg2:#0F1A33; --dot:rgba(110,150,255,.07);
  --surface:#141F3A; --surface2:#1B2A4E;
  --ink:#EAF0FF; --ink2:#A3B3D8;
  --line:#2A3C6A; --line2:#4C66A8;
  --pea:#6CCB3E; --pea-ink:#08210A; --pea-shadow:#2E7A1C; --pea-soft:#1B3A2C; --pea-text:#A4EB84;
  --sun:#F2C14E; --sun-ink:#2B1F00; --sun-soft:#3A3114;
  --coral:#FF7A7A; --coral-soft:#3F2030;
  --door:#5E6E92; --door-dark:#2B3652; --room:#F6D77A; --room2:#E5A93A;
  --focus:#F2C14E; --scrim:rgba(3,6,14,.74);
  --f-kid:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",Meiryo,sans-serif;
  --f-ui:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  color-scheme:dark;
}
:root[data-mode="teacher"]{
  --bg:#EEF2EA; --bg2:#E2EAD8; --dot:rgba(64,120,40,.08);
  --surface:#FFFFFF; --surface2:#F6FAF0;
  --ink:#20331A; --ink2:#566B4A;
  --line:#CADDB9; --line2:#9CBB84;
  --pea:#5DB233; --pea-ink:#FFFFFF; --pea-shadow:#2F6B1E; --pea-soft:#DDF0CB; --pea-text:#2F6B1E;
  --sun:#FFC93C; --sun-ink:#5A3E00; --sun-soft:#FFF1C2;
  --coral:#D9483C; --coral-soft:#FCE6E3;
  --focus:#F2A900; --scrim:rgba(20,32,16,.55);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 3px, transparent 3.5px);
  background-size:38px 38px;
  color:var(--ink); font-family:var(--f-kid); font-size:18px; line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
.kana{word-break:keep-all;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:6px 10px}
.me{background:var(--pea-soft);color:var(--pea-text);font-weight:900;border-radius:999px;padding:.15em 1em;font-size:1.05rem}
.steps{display:flex;gap:8px;list-style:none;margin:0 auto;padding:0;align-items:center}
.steps li{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;color:var(--ink2)}
.steps i{width:16px;height:16px;border-radius:50%;background:var(--line);border:3px solid var(--line);display:block}
.steps li.done i{background:var(--line2);border-color:var(--line2)}
.steps li.now i{background:var(--sun);border-color:var(--ink);transform:scale(1.2)}
.steps li.now{color:var(--ink)}
.ibtn{display:inline-flex;align-items:center;gap:.4em;border:3px solid var(--line2);background:var(--surface);border-radius:999px;padding:.25em .9em;font-weight:900;font-size:1rem;min-height:44px}
.ibtn[aria-pressed="false"]{opacity:.55}
.ibtn svg{width:24px;height:24px}
.tlink{margin-left:auto;background:transparent;border:2px dashed var(--line2);border-radius:10px;color:var(--ink2);font-size:.85rem;padding:.2em .7em;min-height:36px}

/* ---------- layout ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,340px);gap:22px;align-items:start}
.left{display:flex;flex-direction:column;gap:14px;min-width:0}
.right{position:sticky;top:10px;display:flex;flex-direction:column;align-items:center;gap:12px}
h1.title{font-size:clamp(1.9rem,4.6vw,2.7rem);font-weight:900;margin:.1em 0;letter-spacing:.06em;line-height:1.25}
h2.q{font-size:clamp(1.6rem,3.6vw,2.2rem);font-weight:900;margin:0;letter-spacing:.04em;line-height:1.4}
.lead{font-size:1.15rem;font-weight:700;color:var(--ink2);margin:0}
.bubble{position:relative;background:var(--surface);border:3px solid var(--ink);border-radius:24px;padding:.65em 1em;font-size:1.25rem;font-weight:700;line-height:1.55;width:100%}
.bubble::after{content:"";position:absolute;left:50%;bottom:-13px;width:20px;height:20px;background:var(--surface);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble .say{display:inline-flex;align-items:center;justify-content:center;margin-left:.4em;vertical-align:middle;border:2px solid var(--line2);background:var(--surface2);border-radius:50%;width:38px;height:38px;padding:0}
.bubble .say svg{width:22px;height:22px}
.pea{width:min(250px,60vw)}
.pea svg{display:block;width:100%;height:auto;overflow:visible}
.pea .hop{animation:hop .8s ease both}
@keyframes hop{0%{transform:none}35%{transform:translateY(-8%)}60%{transform:none}78%{transform:translateY(-3%)}100%{transform:none}}
.pea .sway{animation:sway 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.stage{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%}

/* ---------- buttons ---------- */
.go{border:0;border-radius:999px;background:var(--pea);color:var(--pea-ink);font-size:1.5rem;font-weight:900;padding:.5em 1.6em;letter-spacing:.06em;box-shadow:0 6px 0 var(--pea-shadow);transition:transform .08s,box-shadow .08s;min-height:60px}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pea-shadow)}
.go.sm{font-size:1.15rem;padding:.35em 1.1em;min-height:52px;box-shadow:0 5px 0 var(--pea-shadow)}
.go[disabled]{opacity:.4;cursor:default}
.plain{border:3px solid var(--line2);background:var(--surface);border-radius:999px;padding:.3em 1em;font-weight:700;font-size:1.05rem;min-height:46px}
.linkbtn{background:transparent;border:0;text-decoration:underline;text-underline-offset:4px;color:var(--ink2);font-weight:700;font-size:.95rem;padding:.4em .5em;min-height:40px}
.row-c{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}

/* ---------- duty list ---------- */
.duties{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.duty{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:3px solid var(--line);border-radius:24px;padding:12px 16px;box-shadow:0 5px 0 var(--line)}
.duty .ico{width:66px;height:66px;border-radius:18px;background:var(--pea-soft);display:grid;place-items:center;font-size:2.4rem;line-height:1}
.duty .nm{font-size:1.6rem;font-weight:900;letter-spacing:.04em;line-height:1.3}
.duty .when{font-size:.9rem;color:var(--ink2);font-weight:700}
.duty.done{background:var(--pea-soft);border-color:var(--pea);box-shadow:0 5px 0 var(--pea)}
.duty .ok{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-weight:900;color:var(--pea-text);font-size:1.2rem}
.duty .ok svg{width:38px;height:38px}
.progress{display:flex;gap:6px;align-items:center;font-weight:900;color:var(--ink2)}
.progress b{font-size:1.5rem;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:.35em;background:var(--sun-soft);color:var(--sun-ink);border-radius:999px;padding:.1em .9em;font-weight:900;font-size:1rem}
.rest{background:var(--surface);border:3px dashed var(--line2);border-radius:26px;padding:22px;text-align:center}
.rest p{margin:.2em 0}

/* ---------- door ---------- */
.doorbox{width:170px;flex:none}
.frame{position:relative;width:100%;aspect-ratio:3/4.3;border:9px solid var(--door-dark);border-bottom:0;border-radius:16px 16px 0 0;background:linear-gradient(var(--room),var(--room2));perspective:700px;overflow:visible}
.panel{position:absolute;inset:0;background:var(--door);border-radius:6px 6px 0 0;transform-origin:left center;transform:rotateY(-72deg);transition:transform .9s cubic-bezier(.45,0,.2,1.35);box-shadow:inset 0 0 0 6px color-mix(in srgb,var(--door-dark) 35%,transparent)}
.closed .panel{transform:rotateY(0)}
.panel .knob{position:absolute;right:14px;top:52%;width:14px;height:14px;border-radius:50%;background:var(--sun);border:2px solid var(--door-dark)}
.panel .win{position:absolute;left:22%;right:22%;top:12%;height:26%;border-radius:50% 50% 8px 8px;background:var(--room);border:4px solid var(--door-dark)}
.floor{height:12px;background:var(--door-dark);border-radius:0 0 8px 8px;margin-inline:-9px}
.door-cap{font-weight:900;text-align:center;color:var(--ink2);margin-top:6px;font-size:.95rem}

/* ---------- reflection ---------- */
.opts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opt{background:var(--surface);border:4px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);padding:14px 10px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:1.35rem;font-weight:900;line-height:1.35;text-align:center;transition:transform .08s,box-shadow .08s}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.opt.on{border-color:var(--ink);box-shadow:0 6px 0 var(--ink);background:var(--sun-soft)}
.opt.dim{opacity:.4}
.opt svg{width:84px;height:84px}
.opt .em{font-size:2.6rem;line-height:1}
.reply{background:var(--pea-soft);border-radius:20px;padding:.6em 1em;font-weight:900;font-size:1.3rem;text-align:center}

/* ---------- calendar ---------- */
.calbox{width:100%;max-width:600px;margin-inline:auto;background:var(--surface);border:4px solid var(--ink);border-radius:28px;padding:14px 14px 10px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.calhead h2{margin:0;font-size:1.6rem;font-weight:900}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{text-align:center;font-weight:900;font-size:.85rem;color:var(--ink2)}
.cell{position:relative;aspect-ratio:1;min-height:0;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;padding:0}
.cell .n{position:absolute;left:8%;top:2%;font-size:.7rem;font-weight:700;color:var(--ink2);line-height:1}
.cell.blank{visibility:hidden}
.cell .ring{position:absolute;inset:6% 6% 0 6%;border-radius:50%;border:2px dashed var(--line2)}
.cell.skip .ring{border-style:dotted;opacity:.45}
.cell.skip .n{opacity:.5}
.cell.today .ring{border:3px solid var(--coral)}
.cell.target .ring{border:3px dashed var(--coral);background:var(--coral-soft);animation:pulse 1.4s ease-in-out infinite}
.cell.target{cursor:pointer}
.cell svg{position:relative;width:88%;height:88%}
.cell .pon{position:relative;font-weight:900;color:var(--coral);font-size:.85rem}
.cell .off{position:relative;font-size:.6rem;color:var(--ink2);font-weight:700;line-height:1.1;text-align:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.stamp-new svg{animation:press .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes press{0%{transform:scale(2.4) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin-top:10px;font-size:.85rem;font-weight:700;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:26px;height:26px}
.result{background:var(--surface);border:4px solid var(--ink);border-radius:28px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.result{flex-direction:row;flex-wrap:wrap;justify-content:center;text-align:left;gap:8px 20px}
.result .txt{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.result svg{width:104px;height:104px;animation:press .8s cubic-bezier(.3,1.6,.5,1) both}
.result .big{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:900;margin:0}
.pts{background:var(--pea-soft);color:var(--pea-text);border-radius:999px;padding:.2em 1.1em;font-weight:900;font-size:1.3rem}

/* ---------- setup ---------- */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.num{background:var(--surface);border:4px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);min-height:84px;font-size:1.9rem;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:4px}
.num small{font-size:.7rem;font-weight:700;color:var(--ink2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:26px;padding:22px;width:min(360px,100%);text-align:center;border:3px solid var(--ink)}
.modal h2{margin:0 0 6px;font-size:1.3rem}
.modal p{margin:.2em 0}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:10px 0 14px}
.pin-dots span{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink)}
.pin-dots span.f{background:var(--ink)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-pad button{height:58px;border-radius:16px;border:3px solid var(--line);background:var(--surface2);font-size:1.5rem;font-weight:700}
.err{color:var(--coral);font-weight:700;min-height:1.6em;margin:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:.6em 1.2em;border-radius:14px;font-weight:700;max-width:90vw;font-family:var(--f-ui);font-size:.95rem}

/* ---------- teacher ---------- */
.t{background:var(--bg);border-radius:16px;padding:4px 14px 14px;font-family:var(--f-ui);font-size:15px;line-height:1.65}
.t h2{font-size:1.15rem;margin:0 0 .4em;font-family:var(--f-ui);font-weight:700}
.t h3{font-size:1rem;margin:1.2em 0 .4em;font-family:var(--f-ui);font-weight:700}
.t p{margin:.3em 0}
.t .note{color:var(--ink2);font-size:.9rem}
.t-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:8px 6px}
.t-top h1{font-size:1.25rem;margin:0;font-family:var(--f-ui)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-block:8px 16px}
.tab{border:0;background:transparent;padding:.55em 1em;border-radius:12px 12px 0 0;font-weight:700;color:var(--ink2);border-bottom:3px solid transparent;position:relative;top:2px;min-height:44px}
.tab.on{color:var(--ink);border-bottom-color:var(--pea);background:var(--surface)}
.panel-t{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.tblw{overflow-x:auto;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
table.g{border-collapse:collapse;width:100%;font-size:.92rem;min-width:640px}
table.g th,table.g td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:middle}
table.g th{background:var(--surface2);font-weight:700;white-space:nowrap}
table.g tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:999px;padding:0 .7em;font-size:.82rem;font-weight:700;border:1.5px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--pea-text)}
.pill.mid{color:var(--sun-ink);background:var(--sun-soft);border-color:transparent}
.pill.no{color:var(--ink2)}
.pill.warn{color:var(--coral)}
.kpis{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:10px}
.kpi b{font-size:1.7rem;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--ink2)}
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:12px;max-width:520px}
.f label,.lab{font-weight:700;font-size:.9rem}
.f input,.f select,.f textarea,.inp{font-family:var(--f-ui);font-size:1rem;padding:.45em .65em;border:2px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink);min-height:42px}
textarea.code{width:100%;min-height:96px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;border:2px solid var(--line2);border-radius:10px;background:var(--surface2);color:var(--ink);padding:.5em}
.rowf{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-block:6px}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:.45em 1.1em;font-weight:700;font-family:var(--f-ui);font-size:.95rem;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:var(--coral);border-color:var(--coral)}
.btn.pri{background:var(--pea);border-color:var(--pea-shadow);color:var(--pea-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.savebar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--sun-soft);color:var(--sun-ink);border:2px solid var(--sun);border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:16px;font-family:var(--f-ui);z-index:5}
.emo{display:flex;flex-wrap:wrap;gap:4px}
.emo button{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);font-size:1.4rem;padding:0}
.emo button.on{border-color:var(--pea);background:var(--pea-soft)}
.kidsel{display:flex;flex-wrap:wrap;gap:4px}
.kidsel button{min-width:40px;height:36px;border-radius:9px;border:2px solid var(--line);background:var(--surface2);font-size:.85rem;font-weight:700;padding:0 6px}
.kidsel button.on{border-color:var(--pea);background:var(--pea-soft);color:var(--pea-text)}
.dutybox{border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:var(--surface)}
.dutybox summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:10px;min-height:40px}
.dutybox summary .em{font-size:1.5rem}
.tdw{display:flex;gap:6px;flex-wrap:wrap}
.tdw label{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:9px;padding:2px 10px;font-weight:700;min-height:36px}

@media (max-width:860px){
  .main{grid-template-columns:1fr}
  .right{position:static;flex-direction:row;flex-wrap:wrap;justify-content:center}
  .doorbox{width:130px}
  .pea{width:min(200px,44vw)}
  .steps li span{display:none}
  .duty{grid-template-columns:auto 1fr;}

/* ================= 小さな道具 ================= */
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return iso(new Date());}
function parseD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2],12);}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return iso(d);}
function wday(s){return parseD(s).getDay();}
function nowHM(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());}
function md(s){var d=parseD(s);return (d.getMonth()+1)+"/"+d.getDate();}
var WD="日月火水木金土";
function clone(o){return JSON.parse(JSON.stringify(o));}
function num(a,b){return a-b;}

/* ================= 保存(この端末の中だけ) ================= */
var memStore={}, storageOK=true;
(function(){try{localStorage.setItem("gp2.probe","1");localStorage.removeItem("gp2.probe");}catch(e){storageOK=false;}try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}})();
function lsGet(k){try{var v=localStorage.getItem(k);return v===null?(memStore[k]||null):v;}catch(e){storageOK=false;return memStore[k]||null;}}
function lsSet(k,v){memStore[k]=v;try{localStorage.setItem(k,v);}catch(e){storageOK=false;return false;}return true;}
function jget(k,d){try{var v=lsGet(k);return v?JSON.parse(v):d;}catch(e){return d;}}
var PEA_SRC=PEA_DEF,PEA_CUSTOM=false,PEA_MODE=lsGet("gp2.peamode")==="orig"?"orig":"spy";
(function(){var o=lsGet("gp2.pea");if(o&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(o)){PEA_SRC=o;PEA_CUSTOM=true;}})();

/* ================= 設定 ================= */
var CFG0=JSON.parse(document.getElementById("gp-config").textContent);
function cleanCfg(o,base){
  if(!o||typeof o!=="object"||!Array.isArray(o.roster)||!Array.isArray(o.duties)||!Array.isArray(o.calendar))return clone(base);
  var c=clone(o);
  if(!/^\d{4}$/.test(String(c.pin||"")))c.pin=base.pin;
  c.roster=c.roster.filter(function(k){return k&&Number.isInteger(k.no)&&k.no>0;}).map(function(k){return {no:k.no,name:String(k.name||"").slice(0,6)};});
  c.duties=c.duties.filter(function(d){return d&&typeof d.id==="string";}).map(function(d){return {id:d.id.slice(0,20),name:String(d.name||"").slice(0,12),icon:String(d.icon||"⭐").slice(0,4),days:Array.isArray(d.days)?d.days.filter(function(x){return x>=0&&x<=6;}):[1,2,3,4,5],from:d.from||"",to:d.to||""};});
  c.calendar=c.calendar.filter(function(e){return e&&/^\d{4}-\d{2}-\d{2}$/.test(e.date||"");});
  c.className=String(c.className||"").slice(0,16);
  c.remindAfter=/^\d{2}:\d{2}$/.test(c.remindAfter||"")?c.remindAfter:"15:00";
  c.hardRun=Math.max(1,Math.min(10,+c.hardRun||2));
  return c;
}
var CFG=cleanCfg(null,CFG0);

function dayType(date){
  var es=calOf(date),w=wday(date),t=(w===0||w===6)?"skip":"school";
  es.forEach(function(e){if(e.kind==="off"||e.kind==="event")t="skip";});

  CFG.duties.forEach(function(d){
    if(!dutyOnDay(d,date))return;
    var got=c[d.id]||{},t;
    if(ME){/* 1人1台: この たんまつは じぶんの ぶんだけ。ほかの子の きろくは まぜない */
      if(memberOf(ME).indexOf(d.id)<0||absentOn(ME,date))return;

    }else{
      t=CFG.roster.filter(function(k){return memberOf(k.no).indexOf(d.id)>=0&&!absentOn(k.no,date);}).map(function(k){return k.no;});
      Object.keys(got).forEach(function(k){k=+k;if(t.indexOf(k)<0&&kidOf(k))t.push(k);});
      t.sort(num);
    }
    if(!t.length)return;
    var done=t.filter(function(n){return !!got[n];});
    out.push({d:d,team:t,done:done,ok:done.length===t.length});

function bmidi(m){return 440*Math.pow(2,(m-69)/12);}

var BROOT=[45,45,41,43,45,45,41,40];
var BQ=[[0,3,7],[0,3,7],[0,4,7],[0,4,7],[0,3,7],[0,3,7],[0,4,7],[0,4,7]];

    RIFF_E={0:64,2:64,3:68,5:64,7:71,10:68,11:64,13:71};

  o.connect(g);g.connect(BG.gain);o.start(t0);o.stop(t0+d+0.05);
}

  var o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();o.type=type;o.frequency.value=f;fl.type="lowpass";fl.frequency.setValueAtTime(cut,t0);fl.frequency.exponentialRampToValueAtTime(Math.max(200,cut/6),t0+d);

function bgSched(){

  while(BG.next<AC.currentTime+0.4){
    var s=BG.step%128,bar=Math.floor(s/16),st=s%16,t=BG.next,root=BROOT[bar],q=BQ[bar];
    /* ドラム */
    if(st%4===0||(st===14&&bar%2===1))bt(58,t,.2,.9,"sine",34);

    if(st===0&&bar===0)bn(t,1.3,.22,"highpass",4500);
    /* ベース(8ぶん音符のはしる低音) */
    if(st%2===0)bpluck(bmidi(root+((st===6||st===14)?12:0)),t,.16,.55,"sawtooth",900);

/* ---- きろくコード(こどもの たんまつ → せんせいの たんまつ) ---- */
var Q1V=["dekita","futsuu","hard"],Q2V=["onaji","teinei","oshieru","sensei","tomodachi","yukkuri"];
function makeCode(){
  if(!ME)return "";
  var rs=[];
  Object.keys(DAYS).sort().slice(-21).forEach(function(t){
    var r=DAYS[t],c={},has=false;
    Object.keys(r.c||{}).forEach(function(id){if(r.c[id][ME]){c[id]=r.c[id][ME];has=true;}});
    var q=r.q&&r.q[ME];
    if(has||q)rs.push({t:t,c:c,q:q||null});
  });
  var o={v:1,n:ME,d:memberOf(ME),r:rs};
  return "GP1."+btoa(JSON.stringify(o)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodeCode(tok){
  try{
    if(tok.indexOf("GP1.")!==0)return null;
    var b=tok.slice(4).replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";
    var o=JSON.parse(atob(b));
    return (o&&o.v===1&&Number.isInteger(o.n)&&Array.isArray(o.d)&&Array.isArray(o.r))?o:null;
  }catch(e){return null;}
}
function importCodes(text){
  var toks=String(text).split(/\s+/).filter(Boolean),ok=0,bad=0,seen={},dates={},t0=today(),newlyClosed=0;
  toks.forEach(function(tok){
    var o=decodeCode(tok);
    if(!o||!kidOf(o.n)){bad++;return;}
    var ids=o.d.filter(function(id){return typeof id==="string"&&CFG.duties.some(function(d){return d.id===id;})}).slice(0,1);
    MEM[o.n]={d:ids,at:(MEM[o.n]&&MEM[o.n].at)||new Date().toISOString()};
    o.r.forEach(function(r){
      if(!r||!/^\d{4}-\d{2}-\d{2}$/.test(r.t||"")||r.t>t0)return;
      var rec=dayRec(r.t);dates[r.t]=1;
      Object.keys(r.c||{}).forEach(function(id){
        if(!CFG.duties.some(function(d){return d.id===id;})||!/^\d{2}:\d{2}$/.test(r.c[id]||""))return;
        rec.c[id]=rec.c[id]||{};if(!rec.c[id][o.n])rec.c[id][o.n]=r.c[id];
      });
      if(Array.isArray(r.q)&&Q1V.indexOf(r.q[0])>=0&&Q2V.indexOf(r.q[1])>=0&&!rec.q[o.n])rec.q[o.n]=[r.q[0],r.q[1],/^\d{2}:\d{2}$/.test(r.q[2]||"")?r.q[2]:nowHM()];
    });
    ok++;
  });
  saveMem();
  Object.keys(dates).sort().forEach(function(d){var had=DAYS[d]&&DAYS[d].z;syncClosed(d);if(!had&&DAYS[d]&&DAYS[d].z)newlyClosed++;});
  return {ok:ok,bad:bad,closed:newlyClosed};
}

  reflect:function(){var t=today(),r=DAYS[t];if(!ME||!board(t).all||(r&&r.q&&r.q[ME]))return;startReflect(ME,t);},
  q1:function(d){
    if(!S.ref)return;S.ref.q1=d.v;
    var ok=(d.v==="hard"?Q2B:Q2A).some(function(o){return o.v===S.ref.q2;});if(!ok)S.ref.q2=null;
    render();say(Q1R[d.v]);sfx("tap");
  },
  next:function(){if(!S.ref||!S.ref.q1)return;S.ref.step=2;render();say("あしたは どうする?");},
  back:function(){if(!S.ref)return;S.ref.step=1;render();},
  q2:function(d){if(!S.ref)return;S.ref.q2=d.v;render();say(S.ref.q1==="hard"?"いっしょに やってみよう":"あしたも たのしみだね");sfx("tap");},
  rdone:function(){
    var R=S.ref;if(!R||!R.q1||!R.q2||!guard("rdone"))return;
    var r=dayRec(R.date);
    if(!r.q[R.no])r.q[R.no]=[R.q1,R.q2,nowHM()];
    saveDays();afterAnswer();
  },
  replay:function(){S.doorDate=today();S.broken=false;S.run++;S.res=null;go("door");wake();sfx("vault");bgmDuck(7500);var run=S.run;setTimeout(function(){if(S.view==="door"&&S.run===run)buzz([260,90,380]);},2050);},
  toStamp:function(){S.res=null;focusTarget();go("stamp");},
  press:function(d){pressStamp(d.date);},
  finish:function(){S.res=null;S.broken=false;if(pending().length){focusTarget();render();autoPress();}else{go("home");}},
  home:function(){S.res=null;go("home");},
  cal:function(){S.res=null;focusTarget();go("stamp");},
  mprev:function(){var y=+S.month.slice(0,4),m=+S.month.slice(5,7)-1;if(m<1){m=12;y--;}S.month=y+"-"+pad(m);render();},
  mnext:function(){var y=+S.month.slice(0,4),m=+S.month.slice(5,7)+1;if(m>12){m=1;y++;}S.month=y+"-"+pad(m);render();},
  /* --- 先生 --- */
  teacher:function(){if(T&&S.view==="teacher")return;S.pin={buf:"",err:""};render();},
  pd:function(d){
    var p=S.pin;if(!p)return;
    if(Date.now()<pinLock){p.err="すこし まってから もういちど";p.buf="";render();return;}
    var pin=CFG.pin||"1234",need=pin.length;if(p.buf.length>=need)return;p.buf+=d.v;
    if(p.buf.length===need){
      if(p.buf===pin){pinFails=0;S.pin=null;T=newT();S.view="teacher";render();window.scrollTo(0,0);return;}
      p.buf="";pinFails++;
      if(pinFails>=5){pinLock=Date.now()+60000;pinFails=0;p.err="すこし まってから もういちど";}else p.err="ばんごうが ちがいます";
    }else p.err="";
    render();
  },
  pdel:function(){if(S.pin){S.pin.buf=S.pin.buf.slice(0,-1);render();}},
  pcancel:function(){S.pin=null;render();},
  tclose:function(){
    T=null;var t=today();
    S.view=pending().length?"stamp":"home";if(S.view==="stamp")focusTarget();render();autoPress();
  },
  tab:function(d){T.tab=d.v;render();},
  tday:function(d){var n=+d.n;T.tdate=n===0?today():addDays(T.tdate,n);render();},
  filt:function(d){T.filter=d.v;render();},
  copyTodo:function(){copyText(T.todoText||"");},
  set:function(d){setPath(d.p.indexOf("T.")===0?T:CFG,d.p.replace(/^T\./,""),d.v);saveCfg();render();},
  tgl:function(d){
    var arr=getPath(CFG,d.p)||[],v=+d.v,i=arr.indexOf(v);
    if(i>=0)arr.splice(i,1);else arr.push(v);arr.sort(num);setPath(CFG,d.p,arr);saveCfg();
  },
  tmem:function(d){
    var n=+d.n,m=MEM[n]||(MEM[n]={d:[],at:new Date().toISOString()}),i=m.d.indexOf(d.d);
    if(i>=0)m.d.splice(i,1);else m.d=[d.d];saveMem();render();
  },
  tchk:function(d){var date=T.tdate,b=board(date),x=b.ds.filter(function(y){return y.d.id===d.d;})[0],n=+d.n;markDone(date,d.d,n,!(x&&x.done.indexOf(n)>=0));syncClosed(date);render();},
  tab_ab:function(d){
    var date=T.tdate,n=+d.n,r=dayRec(date);r.ab=r.ab||{};
    if(r.ab[n])delete r.ab[n];
    else if(absentOn(n,date))return toast("カレンダーで 欠席に なっています。「カレンダー」タブで 直してください",4000);
    else r.ab[n]=1;
    saveDays();syncClosed(date);render();
  },
  qreset:function(d){var r=DAYS[T.tdate];if(r&&r.q){delete r.q[+d.n];saveDays();}render();toast("この児童は もういちど ふりかえりに こたえられます");},
  forceAll:function(){
    arm("force","もういちど おすと、この日の ミッションを ぜんぶ かんりょうに します",function(){
      var date=T.tdate;board(date).ds.forEach(function(x){x.team.forEach(function(n){if(x.done.indexOf(n)<0)markDone(date,x.d.id,n,true);});});
      syncClosed(date);render();
    });
  },
  resetDay:function(){arm("rday","もういちど おすと、この日の きろくを けします",function(){delete DAYS[T.tdate];saveDays();render();});},
  addDuty:function(){var n=CFG.duties.length;CFG.duties.push({id:"d"+Date.now().toString(36),name:"あたらしい とうばん",icon:"⭐",days:[1,2,3,4,5],from:"",to:""});T.op={};T.op[n]=true;saveCfg();render();},
  delDuty:function(d){arm("del"+d.i,"もういちど おすと、この とうばんを けします",function(){
    var u=CFG.duties.splice(+d.i,1)[0];if(u)Object.keys(MEM).forEach(function(k){MEM[k].d=(MEM[k].d||[]).filter(function(x){return x!==u.id;});});
    saveCfg();saveMem();T.op={};render();});},
  resize:function(){
    var n=Math.max(1,Math.min(60,+T.count||CFG.roster.length)),r=CFG.roster;
    while(r.length>n)r.pop();
    while(r.length<n)r.push({no:r.length+1,name:""});
    T.count=n;saveCfg();render();
  },
  unreg:function(d){arm("unreg"+d.n,"もういちど おすと、"+d.n+"番の とうろくを やりなおせます",function(){delete MEM[+d.n];if(+d.n===ME){ME=0;saveMe();}saveMem();render();});},
  addCal:function(){
    var n=T.newCal;if(!n.date)return toast("日づけを えらんでください");
    if(n.to&&n.to<n.date)return toast("〜まで は はじめの日より あとに してください");
    var no=+n.no;if(n.kind==="absent"&&!kidOf(no))return toast("その出席番号の児童は いません");
    var e={date:n.date,kind:n.kind};if(n.to&&n.to>n.date)e.to=n.to;if(n.kind==="absent")e.no=no;if(n.note)e.note=n.note;
    CFG.calendar.push(e);saveCfg();render();
  },
  addHol:function(){
    var t=today(),c=CFG.calendar,add=0;
    HOL.forEach(function(h){if(h[0]<t||c.some(function(e){return e.date===h[0]&&e.kind==="off";}))return;c.push({date:h[0],kind:"off",note:h[1]});add++;});
    if(add)saveCfg();render();toast(add?add+"日ぶん 登録しました。学校の予定と くらべてください":"追加する祝日は ありません",4000);
  },
  delCal:function(d){CFG.calendar.splice(+d.i,1);saveCfg();render();},
  saveXlsx:function(){try{saveBlob(buildXlsx(),"greenpea-kiroku-"+today()+".xlsx");}catch(e){toast("Excelを つくれませんでした");}},
  copyTsv:function(){copyText(tsv());},
  trial:function(d,el){TRIAL=el.checked;lsSet("gp2.trial",TRIAL?"1":"0");loadState();S.pin=null;S.res=null;S.ref=null;S.setup=null;render();toast(TRIAL?"おためしモード: 記録は本番と分けて保存されます":"おためしモードを おわりました");},
  peaReset:function(){lsSet("gp2.pea","");PEA_SRC=PEA_DEF;PEA_CUSTOM=false;render();toast("入れかえた絵を やめました");},
  peaSpy:function(){lsSet("gp2.peamode","spy");PEA_MODE="spy";lsSet("gp2.pea","");PEA_SRC=PEA_DEF;PEA_CUSTOM=false;render();},
  peaOrig:function(){lsSet("gp2.peamode","orig");PEA_MODE="orig";lsSet("gp2.pea","");PEA_SRC=PEA_DEF;PEA_CUSTOM=false;render();},
  classStamp:function(){
    var date=T.tdate,b=board(date);
    if(!b.school)return toast("この日は 授業日ではありません");
    if(DAYS[date]&&DAYS[date].s)return toast("この日の クラスの ハンコは もう おされています");
    var go2=function(){var r=dayRec(date);r.z=r.z||nowHM();saveDays();T=null;S.res=null;S.view="stamp";S.broken=false;S.month=date.slice(0,7);pressStamp(date);};
    if(!b.all)arm("cs","まだ ぜんぶ かんりょうでは ありません。もういちど おすと、このまま クラスの ハンコを おします",go2);else go2();
  },
  classdev:function(d,el){CLASSDEV=el.checked;lsSet("gp2.class",CLASSDEV?"1":"0");render();},
  kidReset:function(){arm("kr","もういちど おすと、この たんまつの とうろくと きろくを ぜんぶ けして、あたらしい こどもに つかえるように します(Excelに 書き出しましたか?)",function(){var n=ME;ME=0;saveMe();if(n)delete MEM[n];saveMem();DAYS={};saveDays();S.setup=null;S.res=null;S.ref=null;go("home");toast("この たんまつを あたらしい こどもに つかえます");});},
  copyCode:function(){copyText(makeCode());},
  impCodes:function(){
    var res=importCodes(T.imp||"");
    T.imp="";T.impMsg=res;render();
  },
  wipeDays:function(){arm("wd","もういちど おすと、この端末の 記録を ぜんぶ けします(Excelに 書き出しましたか?)",function(){DAYS={};saveDays();render();toast("記録を けしました");});},
  wipeMem:function(){arm("wm","もういちど おすと、児童の とうろくを ぜんぶ けします",function(){MEM={};ME=0;saveMe();saveMem();render();toast("とうろくを けしました");});},
  resetCfg:function(){arm("rc","もういちど おすと、せっていを はじめの状態に もどします",function(){CFG=clone(CFG0);saveCfg();T.count=CFG.roster.length;render();});}
};
function applyField(el,live){
  var p=el.getAttribute("data-p");if(!p||!T)return;
  var v=el.value;if(el.getAttribute("data-t")==="num")v=+v;
  if(p==="T.count"){T.count=v;return;}
  if(p==="T.imp"){T.imp=v;return;}
  if(p.indexOf("T.newCal.")===0){setPath(T,p.slice(2),v);if(!live&&el.getAttribute("data-rr"))render();return;}
  if(p==="pin"){if(live)return;if(!/^\d{4}$/.test(String(v))){toast("暗証番号は 4けたの数字に してください",4000);el.value=CFG.pin;return;}}
  setPath(CFG,p,v);saveCfg();
}
function handlePea(file){
  if(!file||!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>12e6)return toast("PNG か JPEG の 画像を えらんでください");
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      var url=c.toDataURL("image/png");
      if(url.length>2200000)url=c.toDataURL("image/webp",.85);
      if(!/^data:image\/(png|webp);base64,/.test(url)||!lsSet("gp2.pea",url)){toast("この絵は 保存できませんでした(大きすぎます)");return;}
      PEA_SRC=url;PEA_CUSTOM=true;render();toast("グリンピースさんの 絵を いれかえました");
    };
    im.onerror=function(){toast("画像を 読みこめませんでした");};
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function handleBgm(file){
  if(!file||!/^audio\//.test(file.type)||file.size>25e6)return toast("音声ファイル(25MBまで)を えらんでください",4000);
  idbRun("readwrite",function(st){return st.put(file,"bgm");}).then(function(){
    bgmStop();CUSTOM_URL=URL.createObjectURL(file);BA=null;lsSet("gp2.bgmname",String(file.name||"入れた曲").slice(0,40));
    if(BGM_ON){wake();bgmStart();}render();toast("BGMを いれかえました");
  },function(){toast("この端末では 曲を 保存できません",4000);});
}
function checkDay(){
  var t=today();if(t===S.today)return false;
  S.today=t;S.bubble=null;S.greeted=false;S.ref=null;S.res=null;S.pin=null;S.m=null;S.gl=0;S.setup=null;S.month=t.slice(0,7);
  if(S.view!=="teacher"){S.view=pending().length?"stamp":"home";if(S.view==="stamp")focusTarget();render();autoPress();}
  return true;
}
$app.addEventListener("click",function(e){
  if(checkDay())return;
  wake();
  var s=e.target.closest("summary[data-open]");
  if(s){e.preventDefault();var oi=+s.getAttribute("data-open"),dt=s.parentNode;dt.open=!dt.open;if(T){T.op=T.op||{};T.op[oi]=dt.open;}return;}
  var t=e.target.closest("[data-act]");if(!t||t.disabled)return;
  if(t.tagName==="INPUT"&&t.type==="checkbox")return;
  var f=ACTS[t.getAttribute("data-act")];if(f){f(t.dataset,t);}
});
$app.addEventListener("change",function(e){
  var el=e.target;
  if(el.type==="file"){if(el.files&&el.files[0]){if(el.id==="bgmFile")handleBgm(el.files[0]);else handlePea(el.files[0]);}return;}
  if(el.tagName==="INPUT"&&el.type==="checkbox"&&el.getAttribute("data-act")){var a=ACTS[el.getAttribute("data-act")];if(a)a(el.dataset,el);return;}
  applyField(el,false);
});
$app.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="bgmVol"){BGM_VOL=Math.max(0,Math.min(100,+el.value||0))/100;lsSet("gp2.bgmv",String(Math.round(BGM_VOL*100)));bgmSet(BGM_VOL);return;}
  if(!el.getAttribute||!el.getAttribute("data-p")||el.getAttribute("data-rr")||el.tagName==="SELECT"||el.type==="date"||el.type==="checkbox")return;
  applyField(el,true);
});

/* ================= はじまり ================= */
(function boot(){
  S.view=pending().length?"stamp":"home";
  if(S.view==="stamp")focusTarget();
  render();autoPress();
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){try{if(BA)BA.pause();if(AC&&AC.state==="running")AC.suspend();}catch(e){}}
    else{checkDay();wake();}
  });
  idbRun("readonly",function(st){return st.get("bgm");}).then(function(b){if(b&&typeof b.size==="number"){CUSTOM_URL=URL.createObjectURL(b);if(T)render();}},function(){});
  setInterval(checkDay,60000);
})();
})();
</script>
