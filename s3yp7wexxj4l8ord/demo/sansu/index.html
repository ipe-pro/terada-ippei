<title>【体験版】さんすう ふりかえりボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap">
<style>
:root{
  --room:#061E3B; --rim:#0A2A4A; --w1:#126CAE; --w2:#0B4F94; --w3:#08356E;
  --foam:#F3FBFE; --navy:#0A2A4A; --sun:#FFD25E; --sun-ink:#3A2A00; --aqua:#7FDCF0; --peb:#9FD3E8;
  --t1:#128B72; --t2:#C4670E; --t3:#C2416B; --t4:#5B4FC4;
  --white:#FFFFFF; --white-dim:rgba(255,255,255,.86);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html{height:100%}
body{min-height:100%;margin:0;background:radial-gradient(120% 80% at 50% 0%,#0B355F 0%,var(--room) 70%);color:var(--white);font-family:var(--font);font-size:18px;line-height:1.6;
  display:flex;flex-direction:column;padding-inline:16px;padding-block:14px}
button{font-family:inherit}

/* ===== すいそう ===== */
.tank{position:relative;flex:1;display:flex;flex-direction:column;width:100%;max-width:1100px;margin-inline:auto;overflow:hidden;
  background:linear-gradient(180deg,var(--w1) 0%,var(--w2) 55%,var(--w3) 100%);
  border:clamp(8px,1.6vw,12px) solid var(--rim);border-radius:clamp(20px,4vw,32px);
  box-shadow:0 0 0 3px #1B4B7A,0 30px 50px -20px rgba(0,0,0,.65),inset 0 0 0 2px rgba(255,255,255,.16),inset 0 0 70px rgba(4,30,70,.5)}
.decor{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.rays{position:absolute;left:0;top:0;width:100%;height:65%;opacity:.55}
.surface{position:absolute;left:0;top:0;width:200%;height:26px}
.bub{position:absolute;bottom:-40px;border-radius:50%;border:2px solid rgba(255,255,255,.5);
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08) 60%);width:var(--s);height:var(--s);left:var(--x)}
.fish{position:absolute;width:54px;height:31px;opacity:.5}
.floor{position:absolute;left:0;right:0;bottom:0;height:78px;width:100%}
.mascot{position:absolute;right:22px;bottom:50px;width:118px;height:auto;z-index:1;pointer-events:none}
@media (max-width:760px){.mascot{display:none}}

@keyframes rise{from{transform:translateY(0) translateX(0)}50%{transform:translateY(-55vh) translateX(10px)}to{transform:translateY(-115vh) translateX(-6px)}}
@keyframes swim{from{transform:translateX(-90px)}to{transform:translateX(1400px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-9px) rotate(var(--r,0deg))}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes ray{0%,100%{opacity:.4}50%{opacity:.65}}
@keyframes hop{0%{transform:translateY(30px) rotate(-30deg);opacity:.4}60%{transform:translateY(-14px) rotate(-8deg);opacity:1}100%{transform:translateY(0) rotate(-8deg);opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .bub{animation:rise var(--d) linear var(--dl) infinite}
  .fish{animation:swim var(--d) linear var(--dl) infinite}
  .surface{animation:drift 14s linear infinite}
  .rays{animation:ray 9s ease-in-out infinite}
  .bobber{animation:bob 4.2s ease-in-out infinite}
  .mascot{animation:bob 5s ease-in-out infinite}
  .sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  .hop{animation:hop .8s cubic-bezier(.2,.9,.3,1.1) both}
}
@media (prefers-reduced-motion:reduce){
  .bub{bottom:var(--y)}
  .fish{display:none}
}

/* ===== うえの おび ===== */
.top{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;padding:14px 22px}
.brand{font-weight:900;font-size:18px;letter-spacing:.04em;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;color:var(--white)}
.bubs{display:flex;gap:8px;list-style:none;margin:0;padding:0;align-items:center}
.bubs li{width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.6);background:transparent}
.bubs li.past{background:var(--aqua);border-color:var(--aqua)}
.bubs li.on{background:var(--sun);border-color:var(--sun);transform:scale(1.35)}
.me{appearance:none;background:rgba(255,255,255,.14);color:var(--white);border:2px solid rgba(255,255,255,.55);border-radius:999px;
  font-size:18px;font-weight:900;padding:3px 18px;cursor:pointer}
.me:hover{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.snd{appearance:none;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.55);border-radius:50%;width:40px;height:40px;flex:none;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--white);margin-left:auto}
.snd:hover{background:rgba(255,255,255,.28)}
.snd svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.snd .mute{display:none}
.snd.off .wave{display:none}
.snd.off .mute{display:block}

.main{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;padding:10px 22px 124px}
.nowrap{white-space:nowrap}
.scr{flex:1;display:flex;flex-direction:column}
.ask{font-size:clamp(28px,5.4vw,46px);font-weight:900;line-height:1.3;margin:4px 0 4px;text-wrap:balance;outline:none;text-shadow:0 2px 0 rgba(4,30,70,.35)}
.hint{margin:0 0 20px;color:var(--white-dim);font-size:clamp(17px,2.4vw,21px);font-weight:500}

/* ===== ボタン ===== */
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.big{appearance:none;border:0;background:var(--sun);color:var(--sun-ink);cursor:pointer;font-size:clamp(24px,3.6vw,32px);font-weight:900;
  padding:16px 48px;border-radius:999px;box-shadow:0 6px 0 #D9A82B;align-self:flex-start;transition:transform .12s,box-shadow .12s}
.big:hover{transform:translateY(-2px);box-shadow:0 8px 0 #D9A82B}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #D9A82B}
.back{appearance:none;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.5);color:var(--white);border-radius:999px;font-size:18px;font-weight:700;
  padding:6px 22px;cursor:pointer}
.back:hover{background:rgba(255,255,255,.24)}
.foot{margin-top:auto;padding-top:26px}

.tile{appearance:none;border:0;color:var(--white);text-align:left;cursor:pointer;border-radius:22px;padding:20px 22px;
  display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:170px;
  box-shadow:0 6px 0 rgba(4,30,70,.45);transition:transform .12s,box-shadow .12s,outline-color .12s}
button.tile:hover{transform:translateY(-2px);box-shadow:0 8px 0 rgba(4,30,70,.45)}
button.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(4,30,70,.45)}
.t-1{background:var(--t1)} .t-2{background:var(--t2)} .t-3{background:var(--t3)} .t-4{background:var(--t4)}
.tile.sel,.opt.sel{outline:4px solid var(--sun);outline-offset:3px}
.goals,.results{display:grid;gap:16px}
.goals{grid-template-columns:repeat(2,minmax(0,1fr))}
.results{grid-template-columns:repeat(3,minmax(0,1fr))}
.ic{width:60px;height:60px;flex:none;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.tl{font-size:clamp(23px,3.4vw,30px);font-weight:900;line-height:1.35}
.tl small{display:block;font-size:clamp(16px,2.1vw,19px);font-weight:500;opacity:.94;margin-top:2px}
.mk{width:72px;height:72px;flex:none;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

.opts{display:grid;gap:14px;max-width:780px}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));max-width:920px}
.opt{appearance:none;border:0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left;
  background:var(--foam);color:var(--navy);font-size:clamp(20px,3vw,26px);font-weight:700;line-height:1.4;min-height:74px;
  padding:12px 22px;border-radius:999px;box-shadow:0 5px 0 var(--peb);transition:transform .12s,box-shadow .12s,background .12s}
.opt:hover{background:var(--sun);box-shadow:0 7px 0 #D9A82B;transform:translateY(-2px)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--peb)}
.opt svg{width:28px;height:28px;flex:none;fill:none;stroke:#128B72;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}

.feels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:920px}
@media (max-width:820px){.feels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.feel{appearance:none;border:0;cursor:pointer;background:var(--foam);color:var(--navy);border-radius:26px;padding:16px 10px 14px;
  display:flex;flex-direction:column;align-items:center;gap:8px;font-size:clamp(19px,2.6vw,23px);font-weight:900;text-align:center;line-height:1.35;
  box-shadow:0 6px 0 var(--peb);transition:transform .12s,box-shadow .12s,background .12s}
.feel:hover{background:var(--sun);box-shadow:0 8px 0 #D9A82B;transform:translateY(-2px)}
.feel:active{transform:translateY(4px);box-shadow:0 2px 0 var(--peb)}
.feel.sel{outline:4px solid var(--sun);outline-offset:3px}
.face{width:clamp(64px,10vw,88px);height:auto}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}
.chip{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);
  border-radius:999px;padding:2px 16px 2px 12px;font-weight:700;font-size:clamp(16px,2.2vw,19px)}
.chip svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:6}
.chip .ic{stroke-width:3.5}
.chip .face{width:28px}

/* ===== タイトル ===== */
.title{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:10px 28px;align-items:center;padding-top:16px}
.tt{font-size:clamp(46px,7.4vw,84px);font-weight:900;line-height:1.12;margin:0 0 20px;letter-spacing:.02em;outline:none;
  text-shadow:0 4px 0 rgba(4,30,70,.4);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.tart{display:flex;justify-content:center;--r:-9deg;position:relative}
.bigd{width:min(100%,460px);height:auto;filter:drop-shadow(0 14px 12px rgba(4,30,70,.35))}
.remind{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;border:2px dashed rgba(127,220,240,.85);border-radius:16px;
  padding:8px 16px;margin:0 0 22px;color:var(--aqua);font-weight:500;font-size:clamp(16px,2.2vw,19px);max-width:30em}
.remind b{font-weight:900;color:var(--white)}
.say{position:absolute;top:2%;left:50%;transform:translateX(-8%);max-width:min(78%,340px);background:var(--foam);color:var(--navy);
  font-weight:700;font-size:clamp(16px,2.3vw,20px);line-height:1.5;padding:12px 18px;border-radius:22px 22px 22px 4px;
  box-shadow:0 6px 0 var(--peb);text-align:left}
.say::after{content:"";position:absolute;left:22px;bottom:-13px;border:10px solid transparent;border-top-color:var(--foam);border-bottom:0}
@media (max-width:760px){
  .title{grid-template-columns:minmax(0,1fr)}
  .tart{order:-1;margin-top:56px}
  .bigd{width:min(80%,340px)}
  .say{top:-46px}
}

/* ===== ばんごう ===== */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:12px;max-width:860px}
.num{appearance:none;border:0;cursor:pointer;height:68px;border-radius:50%;background:var(--foam);color:var(--navy);
  font-size:28px;font-weight:900;box-shadow:0 5px 0 var(--peb);font-variant-numeric:tabular-nums}
.num:hover{background:var(--sun)}
.num:active{transform:translateY(3px);box-shadow:0 2px 0 var(--peb)}
.num.cur{background:var(--sun);outline:3px solid var(--white)}

/* ===== おわり・ロック ===== */
.verdict{display:flex;align-items:center;gap:16px;margin:4px 0 24px;max-width:900px}
.verdict .vd{width:74px;height:auto;flex:none}
.verdict .say.side{position:static;transform:none;max-width:none;margin:0;border-radius:4px 22px 22px 22px}
.verdict .say.side::after{content:"";position:absolute;left:-14px;top:18px;bottom:auto;border:10px solid transparent;border-right-color:var(--foam);border-top-color:transparent}
.stats{display:flex;flex-wrap:wrap;gap:14px;max-width:900px;margin-bottom:16px}
.stat{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);border-radius:18px;padding:8px 18px;font-weight:700;font-size:16px;line-height:1.4}
.stat b{font-size:30px;font-weight:900;color:var(--sun);font-variant-numeric:tabular-nums}
.stat svg{width:34px;height:34px;flex:none;fill:none;stroke:var(--white);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.cmp{max-width:420px;margin:0 0 8px;background:var(--foam);color:var(--navy);border-radius:22px;padding:14px 20px 16px;box-shadow:0 6px 0 var(--peb)}
.cmp.today{outline:4px solid var(--sun);outline-offset:3px}
.cmp h3{font-size:20px;font-weight:900;margin:0 0 6px}
.cmp dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font-size:18px;align-items:center}
.cmp dt{font-weight:500;color:#456;font-size:16px}
.cmp dd{margin:0;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
.cmp dd span{min-width:0}
.cmp dd svg{width:30px;height:30px;flex:none;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:6}
.cmp dd .ic{stroke-width:3.5;color:var(--navy)}
.cmp dd .face{width:34px}
.cmp .none{margin:6px 0 0;color:#456;font-weight:500}
.trail{margin:22px 0 0;max-width:900px}
.trail h3{margin:0 0 10px;font-size:clamp(20px,2.8vw,26px);font-weight:900}
.trail .panel{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);border-radius:22px;padding:14px 12px 8px;overflow-x:auto}
.trail svg{display:block;width:100%;height:auto}
.trail .cap{margin:0 0 8px;color:var(--white-dim);font-size:14px}
.warn{color:#FFE29A;font-weight:900;margin:14px 0 0}
.acts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:22px}

@media (max-width:820px){.results{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){
  .goals{grid-template-columns:minmax(0,1fr)}
  .tile{flex-direction:row;align-items:center;justify-content:flex-start;min-height:96px;gap:16px}
  .ic{width:52px;height:52px}
  .mk{width:56px;height:56px}
  .top,.main{padding-inline:16px}
  .bubs li{width:16px;height:16px}
  .verdict svg{width:56px}
}

/* ===== せんせいよう ===== */
.tpanel{background:var(--foam);color:var(--navy);border-radius:20px;padding:20px;font-size:15px;line-height:1.7}
.tpanel h2{font-size:20px;font-weight:900;margin:0 0 4px}
.tpanel h3{font-size:15px;font-weight:900;margin:22px 0 8px;color:#456;letter-spacing:.06em}
.tpanel .note{color:#456;margin:0 0 14px;font-size:14px}
.trow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:6px}
.trow label{font-weight:700}
.tpanel select{font:inherit;padding:4px 10px;border-radius:8px;border:1px solid #9FB8CC;background:#fff;color:var(--navy)}
.sbtn{appearance:none;border:1px solid #9FB8CC;background:#fff;color:var(--navy);border-radius:999px;padding:3px 16px;font-weight:700;font-size:14px;cursor:pointer}
.sbtn:hover{border-color:#0F86C4;color:#0F86C4}
.sbtn.danger{border-color:#C2416B;color:#C2416B}
.sbtn.danger.fill{background:#C2416B;color:#fff}
.sbtn.sm{padding:1px 12px;font-size:13px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(8em,19em) minmax(0,1fr) 3.5em;gap:10px;align-items:center}
.bar .tr{background:#DCEBF4;border-radius:6px;height:16px;overflow:hidden}
.bar .fl{display:block;height:100%;border-radius:6px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tw{overflow-x:auto}
.tpanel table{border-collapse:collapse;width:100%;min-width:860px;font-size:14px}
.tpanel th,.tpanel td{text-align:left;padding:7px 10px;border:1px solid #C9DCE8;vertical-align:top}
.tpanel th{background:#DCEBF4;white-space:nowrap}
.tpanel td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tpanel textarea{width:100%;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;border:1px solid #9FB8CC;border-radius:8px;padding:8px;background:#fff;color:var(--navy)}
.tpanel select:focus-visible,.tpanel textarea:focus-visible,.sbtn:focus-visible{outline:3px solid #0F86C4;outline-offset:2px}
.mini{display:inline-block;vertical-align:-3px;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;margin-right:4px}
.mini.c1{color:#128B72} .mini.c2{color:#C4670E} .mini.c3{color:#5B4FC4}
@media (max-width:560px){.bar{grid-template-columns:minmax(6em,9em) minmax(0,1fr) 3em}}

/* ===== Formsへ おくる ===== */
.sendbox{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:6px 0 20px;max-width:900px}
.big.send{display:inline-flex;align-items:center;gap:12px;align-self:auto}
.big.send svg{width:36px;height:36px;flex:none;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.sendbox .lead{margin:0;font-weight:900;font-size:clamp(18px,2.6vw,22px)}
.sent-ok{display:inline-flex;align-items:center;gap:10px;margin:4px 0 18px;padding:6px 18px;border-radius:999px;background:rgba(255,255,255,.16);border:2px solid var(--aqua);font-weight:900;color:var(--white)}
.sent-ok svg{width:26px;height:26px;fill:none;stroke:var(--sun);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.unsent{margin-top:16px;display:block;white-space:normal;text-align:left;border-color:var(--sun);color:var(--sun)}
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(4,20,48,.72);display:grid;place-items:center;padding:12px}
.send-box{background:var(--foam);color:var(--navy);width:min(980px,96vw);height:min(92vh,900px);display:flex;flex-direction:column;overflow:hidden;
  border:6px solid var(--rim);border-radius:26px;box-shadow:0 10px 0 #1B4B7A}
.send-head{display:flex;align-items:center;gap:14px;padding:8px 18px;background:#DDF1FA;border-bottom:3px solid var(--peb)}
.send-head p{margin:0;font-size:clamp(20px,3vw,28px);font-weight:900;line-height:1.35}
.send-head b{color:#C2416B;font-size:1.2em}
.send-d{width:90px;height:auto;flex:none}
.send-frame{flex:1;width:100%;border:0;background:#fff}
.send-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;padding:10px;border-top:3px solid var(--peb);background:#DDF1FA}
.send-row .big{font-size:clamp(22px,3vw,28px);padding:10px 36px}
.send-row .back{color:var(--navy);background:#fff;border-color:#7BA3BE}
.send-row .back:hover{background:#F3FBFE}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 22px;border-radius:14px;font-weight:700;z-index:80;max-width:90vw;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.pin{background:var(--foam);color:var(--navy);border-radius:26px;padding:22px;width:min(340px,100%);text-align:center;box-shadow:0 10px 0 #1B4B7A}
.pin h2{margin:0 0 6px;font-size:20px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:10px 0 6px}
.pin-dots span{width:20px;height:20px;border-radius:50%;border:3px solid var(--navy)}
.pin-dots span.f{background:var(--navy)}
.pin .err{min-height:1.6em;margin:0 0 6px;color:#C2416B;font-weight:700;font-size:15px}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-pad button{appearance:none;border:0;border-radius:16px;background:#fff;color:var(--navy);font-size:26px;font-weight:900;height:56px;box-shadow:0 4px 0 var(--peb);cursor:pointer}
.pin-pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--peb)}
.pin small{display:block;margin-top:10px;color:#456;font-size:13px}

/* ===== せんせいよう(あたらしい ぶぶん) ===== */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;max-width:760px}
.rc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;border-radius:12px;border:2px dashed #9FB8CC;color:#789;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.rc.on{border:2px solid var(--navy);background:#fff;color:var(--navy)}
.rc i{display:block;width:12px;height:12px;border-radius:50%}
.rc.unsentflag{border-color:#C2416B}
.tdet{margin:22px 0 0;border:2px solid #C9DCE8;border-radius:14px;padding:4px 14px 12px;background:#fff}
.tdet>summary{cursor:pointer;font-weight:900;padding:8px 0;font-size:16px}
.tdet h4{margin:16px 0 4px;font-size:15px}
.tdet p,.tdet li{margin:4px 0;font-size:14px;color:#345}
.tdet ol{margin:6px 0 6px 1.2em;padding:0}
.tdet textarea{min-height:76px}
.tdet input[type=text],.tdet input[type=number]{font:inherit;padding:4px 10px;border-radius:8px;border:1px solid #9FB8CC;width:6em;color:var(--navy);background:#fff}
.tdet .ok{display:inline-block;padding:1px 12px;border-radius:999px;background:#DDF3EA;color:#0C6B55;font-weight:700;font-size:13px}
.tdet .muted{color:#678;font-size:13px}
.sbtn.fileb{display:inline-block}
.darkwrap{background:linear-gradient(180deg,var(--w1),var(--w3));border-radius:18px;padding:6px 14px 12px;color:#fff;margin-top:6px}
.darkwrap .trail{margin:6px 0 0}
/* ふきだしの ことばが とちゅうで きれないように */
.say,.send-head p,.sent-ok,.unsent{word-break:auto-phrase;text-wrap:balance;overflow-wrap:anywhere}
button.rc{appearance:none;background:transparent;font-family:inherit;cursor:pointer;padding:0}
button.rc.on{background:#fff}
.rc.care{border-color:#C2416B;border-width:3px}
.rc.sel{box-shadow:0 0 0 3px #0F86C4}
.tdet textarea{margin-top:4px}
.sbtn[disabled]{opacity:.45;cursor:not-allowed}

/* ===== こえかけ ===== */
.cheer{max-width:900px;margin:-8px 0 22px 90px;background:var(--foam);color:var(--navy);border-radius:22px;padding:12px 20px 14px;box-shadow:0 6px 0 var(--peb);border:4px solid var(--aqua)}
.cheer.best{border-color:var(--sun);box-shadow:0 6px 0 #D9A82B}
.cheer p{margin:4px 0 0;font-weight:700;font-size:clamp(18px,2.6vw,22px);line-height:1.5}
.cheer-tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 14px 2px 8px;font-weight:900;font-size:16px;background:#DDF1FA;color:#0B4F94}
.cheer.best .cheer-tag{background:var(--sun);color:var(--sun-ink)}
.cheer-tag svg{width:22px;height:22px;fill:currentColor}

@keyframes cheerIn{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}

/* ===== みんなの あしあと ===== */
.share-btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px}
.title .share-btn{display:flex}
.fi{fill:currentColor;stroke:none}

/* 体験版:架空の30人・10日分のダミーデータを、はじめて開いたときだけ、このブラウザの中に入れる(実在の児童の記録ではありません) */
(function () {
  var P = 'taiken-sansu-furikaeri-';
  try { if (localStorage.getItem(P + 'seeded')) return; } catch (e) { return; }
  var T = ['kyokasho', 'drill', 'print', 'park'], G = ['friend', 'teacher', 'textbook', 'practice', 'alone'],
    H = ['noask', 'time', 'hard', 'read', 'focus', 'none2', 'none2', 'none2'],
    F = ['happy', 'proud', 'fun', 'relieved', 'determined', 'happy', 'fun', 'worried', 'tired', 'frustrated'],
    E = ['careful', 'fast', 'ask', 'never', 'teach', 'enjoy'];
  var seed = 20261012;
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function ds(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  var days = [], d = new Date(); d.setHours(12, 0, 0, 0);
  while (days.length < 10) { d.setDate(d.getDate() - 1); if (d.getDay() % 6) days.unshift(ds(d)); }
  var imp = [], mine = [];
  for (var n = 1; n <= 30; n++) {
    var prev = null;
    for (var i = 0; i < days.length; i++) {
      if (n !== 1 && rnd() < 0.1) continue;
      var rec = { id: days[i] + '-' + n, t: days[i] + 'T10:' + p2(10 + Math.floor(rnd() * 40)), date: days[i], num: n,
        task: prev && rnd() < 0.55 ? prev.target : pick(T), whyGood: pick(G), whyHard: pick(H), feel: pick(F),
        target: pick(T), effort: pick(E), sent: true };
      imp.push(rec); if (n === 1) mine.push(rec); prev = rec;
    }
  }
  try {
    localStorage.setItem(P + 'v5', JSON.stringify(mine));
    localStorage.setItem(P + 'me-v2', '1');
    localStorage.setItem(P + 'imp-v1', JSON.stringify(imp));
    localStorage.setItem(P + 'set-v1', JSON.stringify({ classSize: 30 }));
    localStorage.setItem(P + 'seeded', '1');
  } catch (e) {}
})();
</script>

  var XLSX_P = null;
  function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (XLSX_P) return XLSX_P;
    XLSX_P = new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = function () { res(window.XLSX); }; s.onerror = function () { XLSX_P = null; rej(new Error('load')); };
      document.head.appendChild(s);
    });
    return XLSX_P;
  }
  function importRows(rows) {
    if (!rows.length) return { n: 0, msg: '行がありません。' };
    var head = rows[0].map(function (x) { return String(x || '').trim(); });
    var col = function (name) { var i; for (i = 0; i < head.length; i++) if (head[i] === name) return i; for (i = 0; i < head.length; i++) if (head[i].indexOf(name) >= 0) return i; return -1; };
    var cD = col('データ'), cNo = col('出席番号'), cDate = col('日付');
    if (cD < 0 || cNo < 0 || cDate < 0) return { n: 0, msg: '「出席番号」「日付」「データ」の列が見つかりません。Formsの回答のExcelを選んでください。' };
    var got = {}, out = [];
    for (var i = 1; i < rows.length; i++) {
      var row = rows[i]; if (!row || !row[cD]) continue;
      var d; try { d = JSON.parse(String(row[cD])); } catch (e) { continue; }
      var r = {};
      r.num = Number(d.num) || Number(row[cNo]);
      r.date = String(d.date || row[cDate]).trim();
      if (!r.num || !/^\d{4}-\d{2}-\d{2}$/.test(r.date)) continue;
      r.t = d.t || (r.date + 'T00:00'); r.id = d.id || (r.date + '-' + r.num);
      r.task = d.task; r.whyGood = d.whyGood; r.whyHard = d.whyHard; r.feel = d.feel; r.target = d.target; r.effort = d.effort; r.cheer = d.cheer || ''; r.sent = true;
      var key = r.num + '|' + r.date;
      if (got[key] !== undefined) out[got[key]] = r; else { got[key] = out.length; out.push(r); }
    }
    IMPORTED = out; try { localStorage.setItem(IMPKEY, JSON.stringify(IMPORTED)); } catch (e2) {}
    return { n: out.length, msg: out.length + '件を読みこみました。' };
  }
  function doImport(file) {
    if (!file) return;
    S.tMsg = '読みこみ中…'; render();
    var isCsv = /\.csv$/i.test(file.name);
    Promise.all([loadXLSX(), isCsv ? file.text() : file.arrayBuffer()]).then(function (v) {
      var X = v[0], wb = isCsv ? X.read(v[1], { type: 'string' }) : X.read(v[1], { type: 'array' });

      S.tMsg = importRows(rows).msg; S.tOpen = true; render();
    }).catch(function () { S.tMsg = 'ファイルを読みこめませんでした(ネットワークにつながっているか、確認してください)。'; render(); });
  }

  function wrapPhrases(root) {
    var els = root.querySelectorAll('.ask,.hint,.opt>span,.feel>span,.tl,.say,.remind,.stat span,.chip>span,.cmp dd>span,.sendbox .lead,.cheer p,.cheer-tag>span,.sh-lab,.trail h3,.trail .cap');
    Array.prototype.forEach.call(els, function (el) {
      Array.prototype.slice.call(el.childNodes).forEach(function (n) {
        if (n.nodeType !== 3 || !n.nodeValue.trim()) return;
        var p = n.parentNode; if (p.classList && p.classList.contains('nowrap')) return;
        var frag = document.createDocumentFragment();
        n.nodeValue.split(/( +)/).forEach(function (w) {
          if (!w) return;
          if (/^ +$/.test(w)) { frag.appendChild(document.createTextNode(' ')); return; }
          var sp = document.createElement('span'); sp.className = 'nowrap'; sp.textContent = w; frag.appendChild(sp);
        });
        p.replaceChild(frag, n);
      });
    });
  }

  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'tdate') { S.tDate = e.target.value; S.tDel = -1; S.keepScroll = true; render(); var sel = $('tdate'); if (sel) sel.focus(); }
    else if (e.target && e.target.id === 'xlsin') { S.keepScroll = true; doImport(e.target.files && e.target.files[0]); }
  });
  document.addEventListener('toggle', function (e) { if (e.target && e.target.id === 'tset') S.tOpen = e.target.open; }, true);
  document.addEventListener('focusin', function (e) { if (e.target && e.target.id === 'csv') e.target.select(); });
  document.addEventListener('contextmenu', function (e) { if (e.target.closest && e.target.closest('[data-lp]')) e.preventDefault(); });

  /* タイトルを 1.5びょう おすと せんせいよう */
  var timer = null;
  function clearT() { if (timer) { clearTimeout(timer); timer = null; } }
  document.addEventListener('pointerdown', function (e) {
    if (!(e.target.closest && e.target.closest('[data-lp]'))) return;
    clearT();
    timer = setTimeout(openTeacher, 1500);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { document.addEventListener(ev, clearT); });
  window.addEventListener('hashchange', function () {
    if (location.hash === '#sensei') openTeacher();
  });

  /* ===== うみの おと(泡・魚・水のゆらぎ) ===== */
  var audioOn = false;
  try { var sPref = localStorage.getItem('taiken-sansu-audio-v1'); if (sPref !== null) audioOn = sPref === '1'; } catch (e) {}
  var actx = null, anodes = null;
  function renderSoundBtn() {
    var b = $('snd'); if (!b) return;
    b.classList.toggle('off', !audioOn);
    b.setAttribute('aria-label', audioOn ? 'おとを けす' : 'おとを つける');
    b.setAttribute('aria-pressed', String(audioOn));
  }
  function ensureCtx() {
    if (actx) return actx;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    return actx;
  }
  function scheduleBubbles() {
    if (!anodes) return;
    var wait = 900 + Math.random() * 2200;
    anodes.bubT = setTimeout(function () { popBubble(); scheduleBubbles(); }, wait);
  }
  function popBubble() {
    if (!actx || !anodes) return;
    var t = actx.currentTime, f0 = 480 + Math.random() * 520;
    var o = actx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 2.1, t + 0.09);
    var g = actx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(anodes.master); o.start(t); o.stop(t + 0.17);
    if (Math.random() < 0.35) {
      var t2 = t + 0.1 + Math.random() * 0.08, f1 = 380 + Math.random() * 460;
      var o2 = actx.createOscillator(); o2.type = 'sine';
      o2.frequency.setValueAtTime(f1, t2); o2.frequency.exponentialRampToValueAtTime(f1 * 1.9, t2 + 0.08);
      var g2 = actx.createGain(); g2.gain.setValueAtTime(0.0001, t2); g2.gain.exponentialRampToValueAtTime(0.16, t2 + 0.01); g2.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.13);
      o2.connect(g2); g2.connect(anodes.master); o2.start(t2); o2.stop(t2 + 0.15);
    }
  }
  function scheduleFish() {
    if (!anodes) return;
    var wait = 4500 + Math.random() * 6500;
    anodes.fishT = setTimeout(function () { popFish(); scheduleFish(); }, wait);
  }
  function popFish() {
    if (!actx || !anodes) return;
    var t = actx.currentTime, f0 = 900 + Math.random() * 500;
    var o = actx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 1.5, t + 0.05); o.frequency.exponentialRampToValueAtTime(f0 * 1.1, t + 0.12);
    var g = actx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.1, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(anodes.master); o.start(t); o.stop(t + 0.2);
  }
  function startAmbience() {
    var ctx = ensureCtx(); if (!ctx) return;
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    if (anodes) return;
    var master = ctx.createGain(); master.gain.value = 0.16; master.connect(ctx.destination);
    var bufSize = 2 * ctx.sampleRate, buf = ctx.createBuffer(1, bufSize, ctx.sampleRate), data = buf.getChannelData(0);
    var last = 0;
    for (var i = 0; i < bufSize; i++) { var white = Math.random() * 2 - 1; last = (last + 0.02 * white) / 1.02; data[i] = last * 3.4; }
    var noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    var filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 480;
    var ng = ctx.createGain(); ng.gain.value = 0.45;
    noise.connect(filt); filt.connect(ng); ng.connect(master); noise.start();
    var lfo = ctx.createOscillator(); lfo.frequency.value = 0.06;
    var lfoGain = ctx.createGain(); lfoGain.gain.value = 170;
    lfo.connect(lfoGain); lfoGain.connect(filt.frequency); lfo.start();
    anodes = { master: master, noise: noise, lfo: lfo, bubT: null, fishT: null };
    scheduleBubbles(); scheduleFish();
  }
  function stopAmbience() {
    if (!anodes) return;
    clearTimeout(anodes.bubT); clearTimeout(anodes.fishT);
    try { anodes.noise.stop(); } catch (e) {}
    try { anodes.lfo.stop(); } catch (e) {}
    try { anodes.master.disconnect(); } catch (e) {}
    anodes = null;
  }
  function setAudio(on) {
    audioOn = on;
    try { localStorage.setItem('taiken-sansu-audio-v1', on ? '1' : '0'); } catch (e) {}
    renderSoundBtn();
    if (on) startAmbience(); else stopAmbience();
  }
  document.addEventListener('pointerdown', function firstGesture() {
    document.removeEventListener('pointerdown', firstGesture);
    if (audioOn) startAmbience();
  }, { once: true });

  /* あわ・さかな */
  (function () {
    var d = $('decor'), h = '';
    var seed = 7; function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var i = 0; i < 18; i++) {
      var sz = 8 + Math.round(rnd() * 26);
      h += '<span class="bub" style="--s:' + sz + 'px;--x:' + Math.round(rnd() * 96) + '%;--d:' + (12 + Math.round(rnd() * 14)) + 's;--dl:-' + Math.round(rnd() * 20) + 's;--y:' + Math.round(10 + rnd() * 75) + '%"></span>';
    }
    var fishes = [{ t: 22, c: '#FFD25E', d: 46, dl: -10 }, { t: 48, c: '#FF9E8A', d: 62, dl: -34 }, { t: 66, c: '#8FE3F5', d: 54, dl: -22 }];
    fishes.forEach(function (f) { h += '<svg class="fish" style="top:' + f.t + '%;left:0;color:' + f.c + ';--d:' + f.d + 's;--dl:' + f.dl + 's" viewBox="0 0 60 34"><use href="#fish" width="60" height="34"/></svg>'; });
    d.insertAdjacentHTML('beforeend', h);
  })();

  render();
})();
</script>
