<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="1年生が グリンピースさんを たすけながら、こくご・さんすう・おんがくを ふくしゅうする ゲーム（たいけんばん）">
<title>【体験版】グリンピースさんの まいにち（たいけんばん）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Mochiy+Pop+One&display=swap">
<style>
/* layout: 3Dのステージ（上 or 左）＋ もんだいの ノート（下 or 右）。クレヨンの えほんの みひらき */
:root{
  --leaf:#E6F0DA;        /* page ground: うすい わかば */
  --paper:#FFFDF4;       /* ノートの かみ */
  --ink:#22301F;         /* こい みどりがかった すみ */
  --ink-soft:#5E6E57;
  --rule:#D7E4C8;        /* ノートの けい線 */
  --pea:#4FA83A;
  --pea-deep:#2B6B22;
  --sun:#FFC93C;
  --tomato:#E0533C;
  --math:#2F79C8; --kokugo:#D2416A; --music:#8255CF;
  --b-red:#E86A58; --b-blue:#4E8FDB; --b-yel:#F2C230; --b-grn:#5DB548;
  --f-ui:"Mochiy Pop One","Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;
  --f-text:"Kiwi Maru","Hiragino Maru Gothic ProN","UD Digi Kyokasho N-R","Meiryo",serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;font-synthesis:none;background:var(--leaf);color:var(--ink);font-family:var(--f-ui);font-size:18px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
#app{height:100%;display:grid;grid-template-rows:minmax(210px,40%) minmax(0,1fr);gap:12px;padding:12px 16px}
@media (min-width:900px) and (min-aspect-ratio:5/4){#app{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1.15fr) minmax(420px,1fr);gap:16px;padding-block:16px}}

/* ---- stage ---- */
.stage{position:relative;border-radius:22px;overflow:hidden;background:#BFE3F5;box-shadow:inset 0 0 0 3px rgba(43,107,34,.18);min-height:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-btn{border:0;background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 3px 0 var(--rule)}
.hud-title{background:rgba(255,253,244,.88);border-radius:999px;padding:5px 14px;font-weight:900;letter-spacing:.04em}
.dots{display:flex;gap:6px;margin-left:auto;background:rgba(255,253,244,.88);border-radius:999px;padding:7px 10px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--rule)}
.dots i.now{background:var(--sun);box-shadow:0 0 0 2px var(--ink) inset}
.dots i.ok{background:var(--pea)}
.dots i.ng{background:var(--b-blue)}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:999px;font-weight:700;white-space:nowrap;animation:pop .35s ease-out}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.nogl{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;font-size:64px}

/* ---- panel (ノート) ---- */
.panel{min-height:0;overflow:auto;background:var(--paper);border-radius:22px;padding:18px 18px 24px;background-image:repeating-linear-gradient(to bottom,transparent 0 39px,var(--rule) 39px 40px);background-attachment:local;box-shadow:0 6px 0 var(--rule)}
.panel>*{max-width:640px;margin-inline:auto}
.bubble{position:relative;background:#fff;border:3px solid var(--pea);border-radius:20px;padding:12px 16px;font-family:var(--f-text);font-size:clamp(18px,2.4vw,22px);line-height:1.7;font-weight:500}
.bubble::before{content:"";position:absolute;left:28px;top:-14px;border:12px solid transparent;border-bottom-color:var(--pea);border-top:0}
.bubble .who{display:block;font-family:var(--f-ui);font-size:13px;font-weight:900;color:var(--pea-deep);letter-spacing:.08em}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:900;color:#fff;border-radius:999px;padding:3px 12px;letter-spacing:.06em}
.tag.math{background:var(--math)}.tag.kokugo{background:var(--kokugo)}.tag.music{background:var(--music)}
.tag .st{letter-spacing:0;color:var(--sun)}
.qrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.q{font-family:var(--f-text);font-weight:500;font-size:clamp(24px,3.6vw,34px);line-height:1.45;margin:6px 0 10px;text-wrap:balance}
.say{border:0;background:var(--leaf);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.visual{display:flex;justify-content:center;margin:8px 0 14px}
.visual:empty{display:none}
.play{border:0;background:var(--music);color:#fff;border-radius:16px;padding:12px 22px;font-weight:900;font-size:20px;box-shadow:0 5px 0 #5a3aa0}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 #5a3aa0}
.plays{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}
.choices.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices.wide{grid-template-columns:1fr}
.ch{min-height:72px;border:3px solid var(--rule);background:#fff;border-radius:18px;font-family:var(--f-text);font-weight:500;font-size:clamp(22px,3vw,30px);padding:8px 10px;box-shadow:0 6px 0 var(--rule);transition:transform .08s}
.ch:active{transform:translateY(5px);box-shadow:0 1px 0 var(--rule)}
.ch svg{width:100%;max-width:240px;height:auto}
.ch.ok{background:var(--pea);border-color:var(--pea-deep);color:#fff;box-shadow:0 6px 0 var(--pea-deep)}
.ch.ok svg .ink{fill:#fff}.ch.ok svg .rest{stroke:#fff}
.ch.ng{opacity:.35;text-decoration:line-through;box-shadow:none;transform:translateY(5px)}
.ch:disabled{cursor:default}
.fb{margin-top:16px;display:grid;gap:12px}
.fb-good{font-family:var(--f-text);font-weight:500;font-size:24px;color:var(--pea-deep);text-align:center}
.card{border:3px dashed var(--b-blue);background:#F1F7FF;border-radius:18px;padding:12px 16px;font-family:var(--f-text);font-weight:500;line-height:1.7}
.card.hint .ans{display:inline-block;min-width:1.6em;color:transparent;background:var(--sun);border-radius:6px;user-select:none}
.card.hint p.ans,.card.hint .eq.ans,.card.hint div.ans{display:none}
.card.hint .kana-row .hit{background:#fff;border-color:var(--rule)}
.card h3{margin:0 0 6px;font-family:var(--f-ui);font-size:16px;color:var(--math);letter-spacing:.08em}
.card .eq{font-size:24px;margin:4px 0}
.card p{margin:4px 0}
.next{justify-self:center;border:0;background:var(--sun);border-radius:999px;padding:14px 36px;font-weight:900;font-size:22px;box-shadow:0 6px 0 #C99512}
.next:active{transform:translateY(5px);box-shadow:0 1px 0 #C99512}

/* visuals */
.items{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.grp{display:grid;grid-template-columns:repeat(5,auto);gap:4px 6px;font-size:34px;line-height:1.1;background:#fff;border-radius:14px;padding:8px 10px;border:2px solid var(--rule)}
.grp.g2{border-color:var(--sun)}
.grp .gone{opacity:.25;position:relative}
.grp .gone::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:4px;background:var(--tomato);transform:rotate(-30deg);border-radius:2px}
.op{font-family:var(--f-text);font-size:24px;font-weight:500}
.ten{display:grid;grid-template-columns:repeat(5,34px);gap:4px;padding:6px;background:#fff;border:3px solid var(--ink);border-radius:8px;width:max-content;margin:6px auto}
.ten i{height:34px;border:2px solid var(--rule);border-radius:6px;display:block}
.ten i.on{background:radial-gradient(circle,var(--pea) 55%,transparent 58%)}
.ten i.on2{background:radial-gradient(circle,var(--sun) 55%,transparent 58%)}
.pic{font-size:72px;line-height:1}
.visual .pic+.word{margin-left:14px}
.word{font-family:var(--f-text);font-weight:500;font-size:46px;letter-spacing:.12em;align-self:center}
.blank{display:inline-block;color:var(--tomato)}
.sent{font-family:var(--f-text);font-weight:500;font-size:clamp(24px,3.4vw,32px);background:#fff;border-radius:12px;padding:8px 16px;border:2px solid var(--rule)}
.kj{color:var(--tomato);font-weight:500}
.coins{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px}
.coins i{font-style:normal;display:grid;place-items:center;border-radius:50%;font-weight:900}
.coins .c10{width:46px;height:46px;background:#D88B4A;color:#fff;border:3px solid #A8622B}
.coins .c1{width:38px;height:38px;background:#E9EEF0;color:#56626a;border:3px solid #B8C2C8;font-size:15px}
svg.clock{width:min(220px,60vw);height:auto}
svg .face{fill:#fff;stroke:var(--ink);stroke-width:5}
svg .tk{stroke:var(--ink-soft);stroke-width:1.5}
svg .tk5{stroke:var(--ink);stroke-width:3}
svg .num{font:700 20px var(--f-ui);fill:var(--ink)}
svg .hh{stroke:var(--ink);stroke-width:9;stroke-linecap:round}
svg .mh{stroke:var(--tomato);stroke-width:5;stroke-linecap:round}
svg .ink{fill:var(--ink)}
svg .rest{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
svg .rl{font:700 16px var(--f-ui);fill:var(--music)}
svg.rhythm{width:min(300px,80vw);height:auto;background:#fff;border-radius:12px}
svg.bars{width:min(460px,100%);height:auto}
svg .cell{fill:#fff;stroke:var(--rule);stroke-width:1.5}
svg .blbl{font:700 15px var(--f-ui);fill:var(--ink)}
svg .b-red{fill:var(--b-red)}svg .b-blue{fill:var(--b-blue)}svg .b-yel{fill:var(--b-yel)}svg .b-grn{fill:var(--b-grn)}
svg.kbd{width:min(340px,90%);height:auto}
svg .key{fill:#fff;stroke:var(--ink);stroke-width:2}
svg .key.hi{fill:var(--sun);animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{fill:#FFE79A}}
svg .bk{fill:var(--ink)}
svg .kn{font:700 15px var(--f-ui);fill:var(--ink)}
svg .fing{fill:var(--music)}
svg .fn{font:900 16px var(--f-ui);fill:#fff}
svg.cherry{width:120px;height:auto;flex:none}
svg .ctx{font:900 22px var(--f-ui);fill:var(--ink)}
svg .ctx.w{fill:#fff}
svg .stem{stroke:var(--pea-deep);stroke-width:3;fill:none}
svg .c1{fill:var(--tomato)}svg .c2{fill:var(--b-red)}
.rv-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rv-row svg.clock{width:150px}
.steps{margin:0;padding-left:1.3em}
.kana-row{display:flex;gap:6px;flex-wrap:wrap}
.kana-row span{width:44px;height:44px;display:grid;place-items:center;background:#fff;border:2px solid var(--rule);border-radius:10px;font-size:26px}
.kana-row span.hit{background:var(--sun);border-color:var(--ink)}
.kata-tip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kata-tip div{background:#fff;border-radius:10px;padding:6px 10px;border:2px solid var(--rule)}
.kata-tip b{font-size:26px;display:block}
.kata-tip small{font-size:14px}
.kj-card{display:flex;align-items:center;gap:16px}
.kj-card .big{font-size:64px;line-height:1;background:#fff;border:2px solid var(--rule);border-radius:12px;padding:6px 12px}
.kj-card span:last-child{font-size:28px}

/* title */
.title h1,.q,.bubble,.lead,.fb-good,.result p{word-break:keep-all;overflow-wrap:anywhere}
.title h1{font-weight:900;font-size:clamp(26px,4vw,38px);line-height:1.25;margin:4px 0 4px;color:var(--pea-deep);text-wrap:balance;letter-spacing:.02em}
.title .lead{font-family:var(--f-text);font-weight:500;margin:0 0 16px;line-height:1.7;color:var(--ink-soft)}
.scenes{display:grid;gap:12px}
.scene{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;border:3px solid var(--rule);background:#fff;border-radius:20px;padding:12px 16px;box-shadow:0 6px 0 var(--rule)}
.scene:active{transform:translateY(5px);box-shadow:0 1px 0 var(--rule)}
.scene .ic{font-size:40px;line-height:1}
.scene h2{margin:0;font-size:22px;font-weight:900}
.scene .subs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.scene .subs .tag{font-size:12px;padding:2px 9px}
.stamp{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;line-height:1.2;text-align:center;border:3px dashed var(--rule);color:var(--ink-soft)}
.stamp.got{border:3px solid var(--tomato);color:var(--tomato);transform:rotate(-12deg);background:#FFF1EC}
.stamp b{display:block;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.pill{border:2px solid var(--rule);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700}
.pill[aria-pressed="true"]{background:var(--pea);border-color:var(--pea-deep);color:#fff}
.pill:disabled{opacity:.4;cursor:default}
details.lv{margin-top:18px;background:#fff;border-radius:16px;border:2px solid var(--rule);padding:8px 14px}
details.lv summary{font-weight:900;cursor:pointer}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin-top:8px;font-size:15px}
.lvgrid span{display:flex;justify-content:space-between;gap:8px}
.lvgrid .s{color:#D39A0B;letter-spacing:-.05em}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FFF1EC;border-radius:12px;padding:8px 12px}
.result{text-align:center;display:grid;gap:12px;justify-items:center}
.result .big{font-size:56px;letter-spacing:.06em;color:#E3A90F}
.result p{font-family:var(--f-text);font-weight:500;font-size:22px;margin:0}

/* v2: ステージ・ごほうび・おと */
.tophead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.starchip{background:var(--ink);color:var(--sun);font-weight:900;border-radius:999px;padding:6px 14px;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.reward-btn{width:100%;border:3px solid var(--kokugo);background:#FFF0F4;color:var(--kokugo);border-radius:18px;padding:12px;font-weight:900;font-size:20px;box-shadow:0 5px 0 #F1C2CF;margin-bottom:14px}
.reward-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #F1C2CF}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.stg{width:100%;display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;text-align:left;border:3px solid var(--rule);background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 5px 0 var(--rule)}
.stg:active{transform:translateY(4px);box-shadow:0 1px 0 var(--rule)}
.stg .num{width:28px;height:28px;border-radius:50%;background:var(--pea);color:#fff;font-weight:900;display:grid;place-items:center;font-size:15px}
.stg .ic{font-size:30px;line-height:1}
.stg .nm{font-weight:900;font-size:18px;line-height:1.3;min-width:0}
.stg .nm small{display:block;font-size:12px;font-weight:700;color:var(--ink-soft)}
.stg.next{border-color:var(--sun);box-shadow:0 5px 0 #E2B12A;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}
.stg.locked{background:#F2F2EC;color:#9AA295;box-shadow:none;cursor:default}
.stg.locked .num{background:#B9C1B3}
.stg.bossst:not(.locked){background:#1E2448;color:#fff;border-color:#4B3A7A;box-shadow:0 5px 0 #4B3A7A}
.stg.bossst:not(.locked) small{color:#C9C3F0}
.mini-stamp{border:2px solid var(--tomato);color:var(--tomato);border-radius:8px;padding:2px 6px;font-size:12px;font-weight:900;transform:rotate(-10deg)}
.note{font-size:14px;color:var(--ink-soft);margin:8px 0 0;line-height:1.6}
.tabs{display:flex;gap:6px;background:var(--leaf);padding:4px;border-radius:999px}
.tab{border:0;background:transparent;border-radius:999px;padding:8px 18px;font-weight:900;font-size:17px}
.tab[aria-selected="true"]{background:var(--pea);color:#fff}
.rewards .lead{font-family:var(--f-text);font-weight:500;color:var(--ink-soft);margin:10px 0}
h3.slot{display:block;width:auto;height:auto;margin:14px 0 6px;border-radius:0;background:none;font-size:15px;letter-spacing:.1em;color:var(--pea-deep)}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.item{display:grid;justify-items:center;gap:2px;border:3px solid var(--rule);background:#fff;border-radius:16px;padding:8px 4px;box-shadow:0 4px 0 var(--rule)}
.item .ii{font-size:30px;line-height:1.1}
.item .in{font-weight:700;font-size:13px;line-height:1.25;text-align:center}
.item .is{font-size:12px;font-weight:900;color:#B7860B}
.item.own .is{color:var(--pea-deep)}
.item.on{border-color:var(--pea);background:#EDF8E6;box-shadow:0 4px 0 var(--pea-deep)}
.item:disabled{opacity:.45;cursor:default;box-shadow:none}
.hp{display:flex;align-items:center;gap:4px;font-size:16px}
.heart{width:14px;height:14px;background:var(--tomato);border-radius:3px;transform:rotate(45deg) scale(.8);display:inline-block}
.heart.gone{background:var(--rule)}
.plus{color:#D39A0B;font-size:18px}
.earn{font-size:18px!important;color:#B7860B}
.gift{color:var(--kokugo)}
.row.center{justify-content:center}
.result .stamp{width:96px;height:96px;font-size:34px;border:4px solid var(--tomato);color:var(--tomato);transform:rotate(-12deg);background:#FFF1EC;border-radius:50%;display:grid;place-items:center;line-height:1}
.result .stamp b{font-size:14px}
.visual.col{flex-direction:column;align-items:center;gap:12px}
.listen{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.lbtn{border:3px solid var(--music);background:#fff;color:var(--music);border-radius:20px;padding:12px 22px;font-weight:900;font-size:20px;display:grid;justify-items:center;gap:2px;min-width:110px;box-shadow:0 5px 0 #D8CBF2}
.lbtn .spk{font-size:30px;transition:transform .15s}
.lbtn.playing{background:var(--music);color:#fff}
.lbtn.playing .spk{transform:scale(1.35)}
.hl-hint{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:15px}
.hl-hint span{background:#fff;border:2px solid var(--rule);border-radius:999px;padding:4px 12px}
.cups{display:grid;gap:6px;font-size:28px}
.cups div{display:flex;align-items:center;gap:10px}
.cups b{font-size:16px;color:#fff;border-radius:8px;padding:2px 8px;min-width:58px;text-align:center}
.b-redt{background:var(--b-red)}.b-bluet{background:var(--b-blue)}.b-yelt{background:var(--b-yel);color:var(--ink)!important}.b-grnt{background:var(--b-grn)}
svg.tri{width:min(300px,90%);height:auto}
svg .tA{fill:var(--b-red);stroke:var(--ink);stroke-width:2}
svg .tB{fill:var(--b-yel);stroke:var(--ink);stroke-width:2}
svg .tn{font:900 15px var(--f-ui);fill:var(--ink)}
.confirm{margin-top:10px}
/* v3: グリンピースさん(2D)・オープニング・ちず */
.grin{display:block;overflow:visible}
.grin .gs{fill:#7dd35a;stroke:#2e6b1f;stroke-width:4.5;stroke-linejoin:round}
.grin .go{fill:#2e6b1f;stroke:#2e6b1f;stroke-width:9}
.grin .gf{fill:#7dd35a}
.grin .gl{stroke:#2e6b1f;stroke-width:10;fill:none;stroke-linecap:round}
.grin .gli{stroke:#7dd35a;stroke-width:4.5;fill:none;stroke-linecap:round}
.grin .eye{fill:#1d1d1d}
.grin .cheek{fill:#ff8fab;opacity:.75}
.grin .mouth{fill:#e0322c;stroke:#2e6b1f;stroke-width:3.5;stroke-linejoin:round}
.grin .leg,.grin .arm{transform-box:fill-box}
.grin .leg{transform-origin:50% 0}
.grin .arm.l{transform-origin:100% 0}
.grin .arm.r{transform-origin:0 100%}
.grin .arm.r.wave{animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(22deg)}}
.walking .grin .leg.l{animation:legA .28s ease-in-out infinite alternate}
.walking .grin .leg.r{animation:legA .28s ease-in-out infinite alternate-reverse}
@keyframes legA{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.walking .grin{animation:hop .28s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-6%)}}
@keyframes bob{50%{transform:translateY(-4px)}}
.bubble.face-b{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center}
.bubble.face-b::before{display:none}
.bf .grin{width:64px;height:auto}
.hud-btn.snd{padding:6px 10px}

/* opening */
.opening{position:fixed;inset:0;z-index:50;overflow:hidden;background:linear-gradient(#8fd0f2,#d6f0fb 70%);--dw:clamp(120px,17vw,200px);--gw:clamp(130px,22vw,260px);transition:opacity .6s}
.opening.leave{opacity:0;pointer-events:none}
.op-sun{position:absolute;top:6%;right:8%;width:90px;height:90px;border-radius:50%;background:#ffd45a;box-shadow:0 0 0 14px rgba(255,212,90,.35)}
.op-cloud{position:absolute;height:44px;width:120px;background:#fff;border-radius:999px;opacity:.95;animation:drift 22s linear infinite}
.op-cloud::before{content:"";position:absolute;width:60px;height:60px;border-radius:50%;background:#fff;left:22px;top:-26px}
.op-cloud.c1{top:12%;left:-10%}.op-cloud.c2{top:26%;left:30%;animation-duration:30s;transform:scale(.8)}.op-cloud.c3{top:8%;left:62%;animation-duration:26s}
@keyframes drift{to{translate:40vw 0}}
.op-hill{position:absolute;border-radius:50%;background:#8cc964}
.op-hill.h1{width:70vw;height:40vh;left:-15vw;bottom:8%}.op-hill.h2{width:80vw;height:46vh;right:-25vw;bottom:6%;background:#7bbd57}
.op-ground{position:absolute;left:0;right:0;bottom:0;height:20%;background:#a9d97c;border-top:6px solid #8cc964}
.op-title{position:absolute;top:9%;left:16px;right:16px;margin:0;text-align:center;display:grid;gap:4px;font-family:var(--f-ui);font-weight:400;line-height:1.1;color:#fff;paint-order:stroke fill;-webkit-text-stroke:10px var(--pea-deep);text-shadow:0 8px 0 rgba(43,107,34,.35);z-index:3}
.op-title .s1{font-size:clamp(26px,5vw,52px);color:#fff}
.op-title .s2{font-size:clamp(54px,12vw,140px);color:var(--sun);letter-spacing:.04em}
.opening.idle .op-title{animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.opening.slam .op-title{animation:slam .75s cubic-bezier(.2,1.4,.4,1) both}
.opening.slam{animation:shake .35s .55s}
@keyframes slam{from{transform:translateY(-70vh) scale(2.2);opacity:0}60%{opacity:1}to{transform:none}}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
.door-wrap{position:absolute;right:9%;bottom:16%;width:var(--dw);z-index:2;display:grid;justify-items:center;gap:6px}
.door-sign{font-family:var(--f-ui);font-size:clamp(11px,1.4vw,16px);line-height:1.25;text-align:center;background:var(--paper);border:3px solid #8b5a2b;border-radius:10px;padding:4px 10px;color:var(--pea-deep)}
.door-frame{position:relative;width:100%;aspect-ratio:3/5;max-width:100%;background:#fff8d6;border:10px solid #8b5a2b;border-bottom:0;border-radius:999px 999px 0 0;perspective:700px;overflow:hidden}
.door-light{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,#fffbe0,#ffd45a);opacity:0;transition:opacity .6s}
.door-wrap.lit .door-light{opacity:1}
.door-wrap.lit .door-frame{box-shadow:0 0 60px 20px rgba(255,212,90,.7)}
.door{position:absolute;inset:0;background:#e0533c;border-radius:999px 999px 0 0;transform-origin:0 50%;transition:transform 1s cubic-bezier(.3,1.4,.5,1);box-shadow:inset 0 0 0 6px #b23a28}
.door .knob{position:absolute;right:14%;top:58%;width:14%;aspect-ratio:1;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 3px #c99512}
.door .pane{position:absolute;left:22%;right:22%;top:14%;height:22%;border-radius:999px 999px 6px 6px;background:#a9dcf5;box-shadow:inset 0 0 0 4px #b23a28}
.door.open{transform:rotateY(-105deg)}
.op-grin{position:absolute;bottom:15%;left:-35%;width:var(--gw);z-index:4;transition:left 1.7s linear,transform 1s ease-in,opacity 1s ease-in}
.op-grin .grin{width:100%;height:auto}
.op-grin.in{left:calc(91% - var(--dw) - var(--gw))}
.op-grin.enter{left:calc(91% - var(--dw) / 2 - var(--gw) / 2);transform:scale(.45) translateY(-20%);opacity:0}
.op-bubble{position:absolute;z-index:5;bottom:calc(15% + var(--gw) * .82);left:calc(91% - var(--dw) - var(--gw));font-family:var(--f-ui);font-size:clamp(22px,3.4vw,38px);background:#fff;border:4px solid var(--pea-deep);border-radius:24px;padding:10px 22px;animation:pop .3s ease-out}
.op-bubble::after{content:"";position:absolute;left:40%;bottom:-18px;border:14px solid transparent;border-top-color:var(--pea-deep);border-bottom:0}
.op-start{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);z-index:6;border:0;background:var(--sun);font-family:var(--f-ui);font-size:clamp(20px,3vw,30px);padding:16px 40px;border-radius:999px;box-shadow:0 8px 0 #c99512;animation:pulse 1.2s ease-in-out infinite;white-space:nowrap}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
.op-skip{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:7;border:0;background:rgba(255,253,244,.85);border-radius:999px;padding:8px 16px;font-family:var(--f-ui)}
.op-flash{position:absolute;inset:0;background:#fffbe0;opacity:0;pointer-events:none;transition:opacity .4s;z-index:8}
.op-flash.on{opacity:1}

/* map */
.map{position:fixed;inset:0;z-index:40;background:#a9d97c;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(10px + env(safe-area-inset-bottom,0px))}
.map-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.town{font-family:var(--f-ui);font-size:clamp(18px,2.6vw,26px);color:#fff;-webkit-text-stroke:6px var(--pea-deep);paint-order:stroke fill;margin-right:auto}
.mbtn{border:0;background:var(--paper);border-radius:999px;padding:8px 12px;font-family:var(--f-ui);font-size:16px;box-shadow:0 4px 0 #7fb35a}
.mbtn.rew{background:#FFF0F4;color:var(--kokugo)}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7fb35a}
.map-wrap{position:relative;min-height:0}
.map-wrap svg{width:100%;height:100%;display:block}
.map .ol{stroke:#3a4a33;stroke-width:3;stroke-linejoin:round}
.map .rd-b{stroke:#cdb682;stroke-width:46;fill:none;stroke-linecap:round}
.map .rd{stroke:#f3e2b3;stroke-width:36;fill:none;stroke-linecap:round}
.map .rd-l{stroke:#fff;stroke-width:4;stroke-dasharray:12 14;fill:none}
.map .rd-l.fog{opacity:0}
.map .spot.locked{opacity:.5;filter:grayscale(1)}
.map .node{cursor:pointer;outline:none}
.map .nd{fill:#fff;stroke:var(--pea);stroke-width:6}
.map .node.locked{cursor:not-allowed}
.map .node.locked .nd{fill:#e3e6df;stroke:#9aa295}
.map .node.clear .nd{fill:#fff6d6;stroke:#e3a90f}
.map .node:focus-visible .nd{stroke:var(--sun);stroke-width:9}
.map .ndn{font-family:var(--f-ui);font-size:26px;fill:var(--ink)}
.map .ndstar{font-size:28px;fill:#e3a90f;stroke:#fff;stroke-width:3;paint-order:stroke}
.map .ring{fill:rgba(255,201,60,.35);stroke:var(--sun);stroke-width:5;transform-box:fill-box;transform-origin:center;animation:ring 1.3s ease-out infinite}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.3);opacity:0}}
.map .lbl{fill:var(--paper);stroke:#3a4a33;stroke-width:2.5}
.map .lblt{font-family:var(--f-ui);font-size:17px;fill:var(--ink)}
.map .node.locked .lblt{fill:#8a9285}
.map .av-in{animation:bob 1s ease-in-out infinite}
.map .ufo-bob{animation:bob 2s ease-in-out infinite}
.map-talk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;background:var(--paper);border:4px solid var(--pea-deep);border-radius:22px;padding:8px 16px 8px 8px;margin-top:8px;max-width:820px;width:100%;justify-self:center}
.mt-face .grin{width:70px;height:auto}
.map-talk p{margin:0;font-family:var(--f-text);font-weight:500;font-size:clamp(16px,2.1vw,20px);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.map-pop{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;width:min(600px,calc(100% - 32px));background:var(--paper);border:4px solid var(--pea-deep);border-radius:24px;padding:14px 16px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;box-shadow:0 10px 0 rgba(43,107,34,.35);animation:pop2 .3s ease-out}
@keyframes pop2{from{transform:translate(-50%,20px);opacity:0}}
.pop-face .grin{width:96px;height:auto}
.pop-body h2{margin:0 0 4px;font-family:var(--f-ui);font-weight:400;font-size:22px;display:flex;align-items:center;gap:8px}
.pn{width:30px;height:30px;border-radius:50%;background:var(--pea);color:#fff;display:inline-grid;place-items:center;font-size:16px}
.pop-body p{margin:0;font-family:var(--f-text);font-weight:500;font-size:18px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.pop-body .pop-rec{font-size:14px;color:#B7860B}
.pop-body .row{margin-top:10px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,30,15,.45);display:grid;place-items:center;padding:16px}
.sheet{background:var(--paper);border-radius:22px;padding:18px 20px;width:min(680px,100%);max-height:100%;overflow:auto}
.sheet h2{margin:0 0 8px;font-family:var(--f-ui);font-weight:400;color:var(--pea-deep)}
.sheet .note{font-family:system-ui,sans-serif}
@media (max-width:520px){.map-pop{grid-template-columns:64px minmax(0,1fr)}.pop-face .grin{width:64px}.mt-face .grin{width:52px}.mbtn.rew{font-size:14px}}

/* v4: うごく ふくしゅうカード・くとうてん・せつめいぶん */
.hint-sheet{display:grid;gap:12px;border:4px solid var(--b-blue);animation:pop2b .3s ease-out}
@keyframes pop2b{from{transform:translateY(24px) scale(.96);opacity:0}}
.hint-head{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center}
.hint-head .grin{width:72px;height:auto}
.hint-head h2{margin:0;font-family:var(--f-ui);font-weight:400;color:var(--math);font-size:24px}
.hint-head p{margin:2px 0 0;font-family:var(--f-text);font-weight:500;font-size:18px}
.hanim{background:#fff;border:3px solid var(--rule);border-radius:18px;padding:12px;display:grid;justify-items:center;gap:8px}
.hsvg{width:100%;max-width:520px;height:auto;overflow:visible}
.hsvg.hclock{max-width:240px}
.hcap{margin:0;min-height:2.6em;font-family:var(--f-text);font-weight:500;font-size:clamp(20px,2.8vw,26px);text-align:center;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.hcap b{color:var(--tomato);font-size:1.25em}
.hcap.pop{animation:pop3 .35s ease-out}
@keyframes pop3{from{transform:scale(.9);opacity:.3}}
.hsvg .hf{fill:#fff;stroke:var(--ink);stroke-width:3}
.hsvg .hc{fill:#F4F8EF;stroke:var(--rule);stroke-width:2}
.hsvg .hc.blink{animation:blinkc .6s ease-in-out infinite alternate}
@keyframes blinkc{to{fill:#FFE79A;stroke:var(--sun)}}
.hsvg .hl{font:14px var(--f-ui);fill:var(--ink-soft)}
.hsvg .hd{transition:transform .55s cubic-bezier(.3,1.3,.5,1),opacity .4s;opacity:1}
.hsvg .hd.dg{fill:var(--pea);stroke:var(--pea-deep);stroke-width:3}
.hsvg .hd.dy{fill:var(--sun);stroke:#C99512;stroke-width:3}
.hsvg .hd.pick{stroke:var(--tomato);stroke-width:5}
.hsvg .hd.off,.hsvg .off{opacity:0}
.hsvg .hd.gone{opacity:0;transition:opacity .5s}
.hsvg .hn{font:18px var(--f-ui);fill:var(--ink);transition:opacity .3s}
.hsvg .hn.sm{font-size:12px}
.hsvg .bcell{transition:opacity .25s}
.hsvg .hand{transform-box:view-box;transform-origin:100px 100px;transition:transform 1.2s ease-in-out}
.hreplay{justify-self:center}
.cardbtn{justify-self:center;border-color:var(--b-blue);color:var(--math)}
.slot{display:inline-grid;place-items:center;width:1.5em;height:1.5em;margin:0 .1em;border-radius:50%;background:var(--sun);font-size:.7em;vertical-align:middle;color:var(--ink)}
.passage{background:#fff;border:2px solid var(--rule);border-radius:14px;padding:10px 14px;display:grid;gap:6px;text-align:left;max-width:560px}
.passage p{margin:0;font-family:var(--f-text);font-weight:500;font-size:clamp(17px,2.2vw,21px);line-height:1.6;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;word-break:keep-all;overflow-wrap:anywhere}
.pnum{width:26px;height:26px;border-radius:50%;background:var(--kokugo);color:#fff;display:grid;place-items:center;font:14px var(--f-ui);margin-top:4px}
.card .passage b{color:var(--kokugo)}
.card.hint div.ans.passage{display:none}
.card.hint b.ans{font-size:0;padding:0 .4em}
.card.hint b.ans::before{content:"？";font-size:22px;color:var(--ink)}

.map .trialt{font-family:var(--f-ui);font-size:13px;fill:var(--kokugo);stroke:#fff;stroke-width:4;paint-order:stroke}
.trial-badge{display:inline-block;margin-left:8px;vertical-align:middle;font-size:13px;-webkit-text-stroke:0;color:#fff;background:var(--kokugo);border-radius:999px;padding:3px 10px}

/* v5: じかんせいげん・スピードカード・ランキング・おうようへん */
.timer{background:var(--ink);color:var(--sun);border-radius:999px;padding:5px 14px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.timer.low{background:var(--tomato);color:#fff;animation:nudge .8s ease-in-out infinite}
.dots+.timer,.timer+.snd{margin-left:0}
.hud .dots[hidden]+.timer{margin-left:auto}
.tag.adv{background:linear-gradient(90deg,#4B3A7A,#8255CF)}
.goal{font-family:var(--f-text);font-weight:500;font-size:17px;color:var(--ink-soft);text-align:center;margin:10px 0 0}
.speed{display:grid;gap:12px;justify-items:center}
.sp-top{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:900}
.sp-top span{background:#fff;border:2px solid var(--rule);border-radius:999px;padding:4px 14px}
.sp-top .combo{border-color:var(--sun);color:#B7860B}
.flash{width:min(420px,100%);min-height:120px;display:grid;place-items:center;align-content:center;gap:4px;background:#1E2448;color:#fff;border-radius:22px;border:5px solid #8255CF;box-shadow:0 8px 0 #4B3A7A;padding:14px;text-align:center}
.flash.in{animation:flip .28s ease-out}
@keyframes flip{from{transform:perspective(600px) rotateY(80deg) scale(.9);opacity:.2}}
.flash .fq{font-family:var(--f-ui);font-size:clamp(44px,8vw,68px);line-height:1.1;letter-spacing:.04em}
.flash .fs{font-family:var(--f-text);font-size:18px;color:#C9C3F0}
.flash .kjc{font-family:var(--f-text);font-size:1.3em}
.flash.ok{border-color:var(--pea);box-shadow:0 8px 0 var(--pea-deep)}
.flash.ng{border-color:var(--tomato);box-shadow:0 8px 0 #9b2f20;animation:shake .35s}
.cardbar{width:min(420px,100%);height:14px;background:var(--rule);border-radius:999px;overflow:hidden}
.cardbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--tomato),var(--sun),var(--pea));transform-origin:left;border-radius:999px}
.speed .choices{width:min(520px,100%)}
.speed .ch{min-height:80px;font-size:clamp(28px,4vw,38px)}
.hpbar{display:flex;align-items:center;gap:6px;font-size:15px}
.hpbar b{display:block;width:clamp(70px,14vw,140px);height:12px;border-radius:999px;background:var(--rule);overflow:hidden}
.hpbar b i{display:block;height:100%;background:var(--tomato);transition:width .3s}
.score-big{font-family:var(--f-ui);font-size:clamp(44px,8vw,64px);color:var(--tomato);line-height:1}
.score-big small{font-size:.4em;color:var(--ink)}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stats span{background:#fff;border:2px solid var(--rule);border-radius:14px;padding:6px 12px;font-weight:700;font-size:16px}
.stats b{color:var(--math);font-size:20px}
.pb{background:var(--sun);color:var(--ink);border-radius:999px;padding:6px 18px;font-weight:900;font-size:20px;animation:pop3 .5s ease-out,nudge 1.4s ease-in-out .5s infinite;box-shadow:0 4px 0 #C99512}
.pbx{font-family:var(--f-ui);font-size:clamp(34px,7vw,52px);color:#fff;background:var(--tomato);border-radius:999px;padding:4px 30px;box-shadow:0 6px 0 #A8361F;animation:pbin .7s 1s cubic-bezier(.2,1.7,.4,1) both,nudge 1.4s 1.8s ease-in-out infinite}
@keyframes pbin{0%{transform:scale(0) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
.bestline{margin:0;font-weight:900;font-size:18px;color:var(--ink-soft)}
.pickrow{display:flex;gap:6px;flex-wrap:wrap}
.pickrow button{min-width:48px;min-height:44px;border:2px solid var(--rule);background:#fff;border-radius:12px;font-weight:900;font-size:18px}
.pickrow button[aria-pressed="true"]{background:var(--pea);border-color:var(--pea-deep);color:#fff}
.regin,.setin{font:inherit;font-size:20px;padding:8px 12px;border:3px solid var(--rule);border-radius:12px;width:min(320px,100%);background:#fff}
.setin{font-size:15px;font-family:system-ui,sans-serif;width:100%}
.vm{display:grid;gap:8px;font-family:system-ui,sans-serif;font-size:15px}
.vm label{display:grid;gap:2px;font-weight:700}
.vm textarea{font:inherit;font-size:13px;min-height:52px;border:2px solid var(--rule);border-radius:10px;padding:6px}
.vm select{font:inherit;padding:6px;border:2px solid var(--rule);border-radius:10px}
.vmchars{display:grid;gap:6px}
.vmrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:6px;align-items:center;background:#fff;border:2px solid var(--rule);border-radius:12px;padding:6px 8px}
.vmrow details{grid-column:1/-1;font-size:13px}
@media (max-width:640px){.vmrow{grid-template-columns:1fr auto auto}.vmrow>b{grid-column:1/-1}}
.vmrow textarea{width:100%}
.vm .prog{height:12px;background:var(--rule);border-radius:999px;overflow:hidden}
.vm .prog i{display:block;height:100%;width:0;background:var(--pea)}
.vm .log{font-size:13px;color:var(--ink-soft);white-space:pre-wrap;max-height:120px;overflow:auto;background:#fff;border-radius:8px;padding:6px}
.stack{display:grid;gap:10px;justify-items:center}
.nline{display:flex;gap:0;flex-wrap:wrap;justify-content:center;border-bottom:4px solid var(--ink);padding-bottom:4px}
.nline span{min-width:44px;text-align:center;font-family:var(--f-ui);font-size:26px;position:relative;padding-bottom:10px}
.nline span::after{content:"";position:absolute;left:50%;bottom:-4px;width:3px;height:12px;background:var(--ink)}
.next:disabled{opacity:.4;cursor:default;box-shadow:none}
.line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;font-size:clamp(28px,6vw,40px)}
.line .lf,.line .lb{font-family:var(--f-ui);font-size:14px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 8px}
.line span.k{display:grid;justify-items:center;line-height:1.1}
.line span.k small{font:14px var(--f-ui);color:var(--math)}
.line span.k.hit{background:var(--sun);border-radius:10px}
.wcards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wcards span{font-family:var(--f-text);font-weight:500;font-size:26px;background:#fff;border:3px solid var(--kokugo);border-radius:12px;padding:4px 12px;box-shadow:0 4px 0 #F1C2CF}
.clocks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.clocks figure{margin:0;display:grid;justify-items:center;gap:2px;font-weight:900}
.clocks svg.clock{width:min(130px,28vw)}
.ch svg.clock{max-width:130px}
svg.area{width:min(460px,100%);height:auto}
svg .ac{stroke:var(--ink);stroke-width:1.5}
svg .al{font:900 18px var(--f-ui);fill:var(--ink)}
.map.adv{background:#1E2448}
.map.adv .town{-webkit-text-stroke:6px #4B3A7A}
.map .lbl.adv{fill:#2E2A5C;stroke:#C9C3F0}
.map .lblt.adv{fill:#fff}
.mbtn.world{background:#1E2448;color:#fff;box-shadow:0 4px 0 #4B3A7A}
.map.adv .mbtn.world{background:#a9d97c;color:var(--ink);box-shadow:0 4px 0 #7fb35a}

const uniq = a => [...new Set(a)];

function numChoices(ans, { n = 4, min = 0, extra = [] } = {}) {
  const s = [ans];
  const add = v => { if (Number.isInteger(v) && v >= min && !s.includes(v) && s.length < n) s.push(v); };
  extra.forEach(add);
  shuffle([1, -1, 2, -2, 10, -10]).forEach(d => add(ans + d));
  let g = 0; while (s.length < n && g++ < 200) add(ans + R(-6, 6));
  return shuffle(s).map(v => ({ v: String(v), html: String(v) }));
}
function textChoices(ans, wrongs, n = 4) {
  const w = uniq(wrongs.filter(x => x !== ans)).slice(0, n - 1);
  return shuffle([ans, ...w]).map(v => ({ v, html: v }));
}

const Timer = (() => {

    const left = (end - Date.now()) / 1000, e = el(), sec = Math.ceil(left);
    e.textContent = fmtSec(left); e.classList.toggle('low', left <= 30);
    if (sec !== lastSec) { lastSec = sec; if (sec <= 10 && sec > 0) Sound.sfx('tick'); }
    if (left <= 0) { const f = onEnd; stop(); f && f(); }
  }
  function start(sec, done, label) { stop(); end = Date.now() + sec * 1000; onEnd = done; lastSec = -1; const e = el(); e.hidden = false; e.setAttribute('aria-label', label || 'のこり じかん'); tick(); h = setInterval(tick, 250); }
  function stop() { if (h) clearInterval(h); h = null; onEnd = null; const e = el(); e.hidden = true; e.classList.remove('low'); }

  const wide = (p.choices[0].html.length > 14 && !p.choices[0].html.startsWith('<')) || p.answer.length > 10;
  let plays = '';
  if (p.notes) plays = `<button class="play" id="pl-all">♪ おとを きく</button>`;
  if (p.rhythm) plays = `<button class="play" id="pl-all">♪ リズムを きく</button>`;
  if (p.freqs) plays = `<div class="listen">${p.freqs.map((f, i) => `<button class="lbtn" id="lb-${i}" data-f="${f}"><span class="spk" aria-hidden="true">🔊</span>${i + 1}ばんめ</button>`).join('')}</div><button class="play" id="pl-all">♪ つづけて きく</button>`;
  panel.innerHTML = `
    <div class="bubble face-b"><span class="bf">${cuteSVG(who)}</span><span><span class="who">${CAST[who].name}</span>${p.story && /[0-9０-９]/.test(p.story) ? p.story : who === 'pea' ? 'おしえて！' : short(ask)}</span></div>
    <div class="qrow"><span class="tag ${play.st.adv ? 'adv' : T.subj}">${play.st.adv ? 'おうよう・' : ''}${SUBJ[T.subj]}・${T.name} <span class="st" aria-label="レベル${L}">${stars5(L)}</span></span><span class="tag" style="background:var(--ink)">${play.score}てん</span><button class="say" id="sayBtn" aria-label="もういちど きく">🔊 もういちど</button></div>
    <p class="q">${p.q}</p>
    <div class="visual ${plays ? 'col' : ''}">${p.visual || ''}${plays}</div>
    <div class="choices ${wide ? 'wide' : p.choices.length === 3 ? 'c3' : ''}" id="choices">${p.choices.map((c, i) => `<button class="ch" id="ch-${i}" data-v="${esc(c.v)}" ${c.label ? `aria-label="${c.label}"` : ''}>${c.html}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>`;
  panel.scrollTop = 0;
  $('#sayBtn').onclick = () => speak(p.say, true, who);
  const glow = i => panel.querySelectorAll('.lbtn').forEach((b, k) => b.classList.toggle('playing', k === i));
  if (p.notes) $('#pl-all').onclick = () => Sound.notes(p.notes.map(i => NOTES[i].f), .7);
  if (p.rhythm) $('#pl-all').onclick = () => Sound.rhythm(p.rhythm);
  if (p.freqs) {
    $('#pl-all').onclick = () => { Voice.stop(); Sound.notes(p.freqs, 1.3, glow); };
    panel.querySelectorAll('.lbtn').forEach((b, i) => b.onclick = () => { Voice.stop(); Sound.notes([+b.dataset.f], 1.3, k => glow(k < 0 ? -1 : i)); });
  }
  panel.querySelectorAll('.ch').forEach(b => b.onclick = () => answer(b));
  speak(ask ? ask + ' ' + p.say : p.say, false, who);
}
function adjustLevel(type, firstTry) {
  const st = S.streak[type] || { ok: 0, ng: 0 }; const L = lvOf(type);
  if (firstTry) { st.ok++; st.ng = 0; if (st.ok >= 3 && L < 5) { S.lv[type] = L + 1; st.ok = 0; setTimeout(() => Sound.sfx('levelup'), 900); setTimeout(() => toast(`レベルアップ！ ${TYPES[type].name} ${stars5(L + 1)}`), 900); } }
  else { st.ng++; st.ok = 0; if (st.ng >= 2 && L > 1) { S.lv[type] = L - 1; st.ng = 0; setTimeout(() => toast(`${TYPES[type].name}を ふくしゅう しよう`), 900); } }
  S.streak[type] = st; save();
}
function nextBtn(fb) {
  const last = play.i + 1 >= play.queue.length;
  fb.insertAdjacentHTML('beforeend', `<button class="next" id="nextBtn">${last ? 'おしまい' : 'つぎへ'}</button>`);
  $('#nextBtn').onclick = () => { if (!play || play.done) return; Sound.sfx('tap'); play.i++; play.i < play.queue.length ? question() : finish(); };
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function answer(btn) {
  if (!play || play.done) return;
  const p = play.p, fb = $('#fb');
  if (btn.dataset.v === p.answer) {
    btn.classList.add('ok'); panel.querySelectorAll('.ch,.lbtn').forEach(b => b.disabled = true);
    Sound.good(); World.react('happy');
    const first = play.tries === 0, gain = first ? 100 : 50;
    play.marks[play.i] = first; play.answered++; play.score += gain;
    if (first) { play.first++; S.stars++; setTimeout(() => Sound.sfx('star'), 450); }
    adjustLevel(play.type, first); renderDots();
    const msg = play.who === 'pea' ? pick(PRAISE) : pick(CAST[play.who].thanks);
    if (play.who !== 'pea') World.cheer(play.who);
    fb.innerHTML = `<div class="fb-good">${msg} <span class="plus">+${gain}てん${first ? '・★+1' : ''}</span></div>`;
    speak(msg, false, play.who); nextBtn(fb); return;
  }
  play.tries++; btn.classList.add('ng'); btn.disabled = true; Sound.bad(); World.react('sad');
  if (play.tries === 1) {
    fb.innerHTML = `<button class="pill cardbtn" id="cardBtn">📖 ふくしゅうカード</button>`;
    $('#cardBtn').onclick = () => Hint.open(p, false);
    speak(pick(TRY));
    const p0 = play;
    setTimeout(() => { if (play === p0 && !p0.done) Hint.open(p, false, () => $('#choices') && $('#choices').scrollIntoView({ behavior: 'smooth', block: 'center' })); }, 900);
  } else {
    panel.querySelectorAll('.ch').forEach(b => { b.disabled = true; if (b.dataset.v === p.answer) b.classList.add('ok'); });
    play.marks[play.i] = false; play.answered++; adjustLevel(play.type, false); renderDots();
    const msg = 'こたえは みどりの ところ だよ。ふくしゅうカードで おぼえよう！';
    fb.innerHTML = `<div class="fb-good" style="color:var(--math)">${short(msg)}</div><button class="pill cardbtn" id="cardBtn">📖 ふくしゅうカード</button>`;
    $('#cardBtn').onclick = () => Hint.open(p, true);
    speak(msg); nextBtn(fb);
    const p0 = play;
    setTimeout(() => { if (play === p0 && !p0.done) Hint.open(p, true); }, 1200);
  }
}
/* じかんぎれ */
function timeUp() {
  const p0 = play; if (!p0 || p0.done) return;
  p0.done = true; p0.timeout = true;
  Hint.close(); Voice.stop(); Sound.sfx('timeup'); cancelAnimationFrame(p0.raf); clearTimeout(p0.cardTO);
  panel.querySelectorAll('button').forEach(b => b.disabled = true);
  toast('じかん しゅうりょう！');
  setTimeout(() => { if (play === p0) p0.speed ? finishSpeed() : finish(); }, 1300);
}
function finish() {
  const p = play, st = p.st, n = p.first, left = Timer.left(), done = p.answered >= p.queue.length && !p.timeout;
  Timer.stop(); p.done = true; Hint.close();
  const bonus = done ? 200 + Math.round(left * 2) : 0, score = p.score + bonus;
  const acc = p.answered ? Math.round(n / p.answered * 100) : 0, rate = Math.round(p.answered / p.queue.length * 100);
  const firstClear = done && !S.clears[st.id], starBonus = done ? 2 : 0;
  if (done) S.clears[st.id] = (S.clears[st.id] || 0) + 1;
  S.best[st.id] = Math.max(S.best[st.id] || 0, n); S.stars += starBonus;
  save();
  const msg = !done ? 'じかん ぎれ！ でも よく がんばったね。もういちど ちょうせん して、さいごまで とこう！'
    : n >= 8 ? 'みんなの おかげで ぜんぶ できたよ！ ほんとうに ありがとう！' : n >= 5 ? 'たくさん おしえて くれて ありがとう！ また いっしょに やろうね。' : 'さいごまで できたね！ ふくしゅう して、また ちょうせん しよう！';
  const stats = [['たっせいりつ', `${rate}%`], ['せいかいりつ', `${acc}%`], ['1かいで せいかい', `${n}もん`]];
  if (done && S.timeLimit) stats.push(['のこり じかん', fmtSec(left)]);
  if (bonus) stats.push(['ボーナス', `+${bonus}`]);
  renderResult({ st, idx: p.idx, score, cleared: done, firstClear, stats, msg, stars: n + starBonus, acc });
}

/* ===== スピードカード（うちゅうじんせん） ===== */
function startSpeed(i) {
  const st = STAGES[i];
  const p0 = play = { idx: i, st, speed: true, hp: SPEED_HP, maxHp: SPEED_HP, n: 0, combo: 0, maxCombo: 0, correct: 0, answered: 0, score: 0, done: false };
  World.build(st.set); World.walkIn(); hud(st.name, true); Sound.bgm('boss'); Sound.sfx('rumble'); renderDots();
  panel.innerHTML = `<div class="bubble face-b"><span class="bf">${grinSVG('', true)}</span><span><span class="who">グリンピースさん</span>${short(st.intro)}</span></div>
    <p class="goal">🃏 ${SPEED_HP}かい あてて たおそう！${S.timeLimit ? '　⏱ 5ふん' : ''}</p>
    <div class="fb"><button class="next" id="goBtn">たたかう！</button></div>`;
  speak(st.intro).then(() => { if (play === p0 && !p0.started) speak(st.speed === 'adv' ? ALIEN_LINES.adv : ALIEN_LINES.start, false, 'alien'); });
  $('#goBtn').onclick = () => {
    Sound.sfx('tap'); p0.started = true; Voice.stop();
    if (S.timeLimit) Timer.start(PLAY_SEC, timeUp);
    panel.innerHTML = `<div class="speed"><div class="sp-top"><span class="combo" id="spCombo">コンボ 0</span><span id="spScore">0てん</span></div>
      <div class="flash" id="flash" aria-live="polite"></div><div class="cardbar"><i id="cardBar"></i></div>
      <div class="choices" id="choices"></div><div class="fb" id="fb"></div></div>`;
    nextCard();
  };
}
function nextCard() {
  const p = play; if (!p || !p.speed || p.done) return;
  const c = speedCard(SPEED_DECK[p.st.speed](p.n++)), sec = Math.max(4, 9 - p.combo * .3);
  p.card = c; p.locked = false;
  const f = $('#flash'); f.className = 'flash'; void f.offsetWidth; f.classList.add('in');
  f.innerHTML = `<span class="fq">${c.q}</span>${c.sub ? `<span class="fs">${c.sub}</span>` : ''}`;
  const chs = $('#choices'); chs.className = `choices ${c.choices.length === 3 ? 'c3' : ''}`;
  chs.innerHTML = c.choices.map(x => `<button class="ch" data-v="${esc(x.v)}">${x.html}</button>`).join('');
  chs.querySelectorAll('.ch').forEach(b => b.onclick = () => pickCard(b));
  $('#fb').innerHTML = '';
  Sound.sfx('card');
  p.cardEnd = performance.now() + sec * 1000;
  const bar = $('#cardBar');
  const step = now => {
    if (play !== p || p.card !== c || p.locked || p.done) return;
    const k = Math.max(0, (p.cardEnd - now) / (sec * 1000)); bar.style.transform = `scaleX(${k})`;
    if (k <= 0) { pickCard(null); return; }
    p.raf = requestAnimationFrame(step);
  };
  cancelAnimationFrame(p.raf); p.raf = requestAnimationFrame(step);
  clearTimeout(p.cardTO); p.cardTO = setTimeout(() => { if (play === p && p.card === c && !p.locked) pickCard(null); }, sec * 1000 + 50);
}
function pickCard(btn) {
  const p = play; if (!p || !p.speed || p.locked || p.done) return;
  p.locked = true; cancelAnimationFrame(p.raf); clearTimeout(p.cardTO);
  const c = p.card, ok = !!btn && btn.dataset.v === c.answer, f = $('#flash');
  p.answered++;
  panel.querySelectorAll('#choices .ch').forEach(b => { b.disabled = true; if (b.dataset.v === c.answer) b.classList.add('ok'); });
  if (ok) {
    const left = Math.max(0, (p.cardEnd - performance.now()) / 1000), gain = 100 + Math.min(p.combo + 1, 10) * 10 + Math.round(left * 10);
    p.combo++; p.maxCombo = Math.max(p.maxCombo, p.combo); p.correct++; p.hp--; p.score += gain;
    f.classList.add('ok'); Sound.good(); World.react('happy'); if (p.combo % 3 === 0) Sound.sfx('combo');
    $('#fb').innerHTML = `<div class="fb-good">まめビーム！ <span class="plus">+${gain}</span>${p.combo >= 3 ? ` <span class="plus">${p.combo}コンボ！</span>` : ''}</div>`;
    if (p.hp === Math.floor(p.maxHp / 2)) speak(ALIEN_LINES.half, false, 'alien');
  } else {
    if (btn) btn.classList.add('ng');
    p.combo = 0; f.classList.add('ng'); Sound.bad(); World.react('sad');
    $('#fb').innerHTML = `<div class="fb-good" style="color:var(--math)">${btn ? 'おしい！' : 'じかん ぎれ！'} こたえは「${c.answer}」</div>`;
    if (Math.random() < .3) speak(ALIEN_LINES.laugh, false, 'alien');
  }
  $('#spCombo').textContent = `コンボ ${p.combo}`; $('#spScore').textContent = `${p.score}てん`; renderDots();
  if (p.hp <= 0) { p.done = true; setTimeout(() => { if (play === p) finishSpeed(); }, 900); return; }
  setTimeout(() => { if (play === p) nextCard(); }, ok ? 600 : 1400);
}
function finishSpeed() {
  const p = play, st = p.st, win = p.hp <= 0, left = Timer.left();
  Timer.stop(); p.done = true; cancelAnimationFrame(p.raf); clearTimeout(p.cardTO);
  const bonus = win ? 300 + Math.round(left * 5) : 0, score = p.score + bonus;
  const acc = p.answered ? Math.round(p.correct / p.answered * 100) : 0, firstClear = win && !S.clears[st.id];
  const stars = Math.ceil(p.correct / 2) + (win ? 5 : 0);
  S.stars += stars;
  if (win) S.clears[st.id] = (S.clears[st.id] || 0) + 1;
  S.best[st.id] = Math.max(S.best[st.id] || 0, p.correct);
  let gift = '';
  if (st.id === 'space' && firstClear) { ['helmet', 'cape'].forEach(id => { if (!S.owned.includes(id)) S.owned.push(id); }); gift = TRIAL ? 'ごほうびに「うちゅうヘルメット」と「ヒーローマント」を もらったよ！ たいけんばんは ここまで！ あそんで くれて ありがとう！ つづきの ステージや「うちゅうの おうようへん」は せいひんばんで あそべるよ！' : 'ごほうびに「うちゅうヘルメット」と「ヒーローマント」を もらったよ！ あたらしい せかい「うちゅうの おうようへん」も ひらいたよ！'; }
  save();
  if (win) World.defeat();
  const msg = win ? (st.id === 'space' ? 'やったね！ うちゅうじんは UFOで にげて いったよ！ まちを まもって くれて ありがとう！' : 'さいごの ちょうせんにも かったよ！ きみは うちゅう いちの はかせだ！')
    : 'うちゅうじんは まだ げんき…。カードを たくさん れんしゅう して、もういちど ちょうせん しよう！';
  const stats = [['せいかい', `${p.correct}まい`], ['せいかいりつ', `${acc}%`], ['さいだい コンボ', p.maxCombo]];
  if (win && S.timeLimit) stats.push(['のこり じかん', fmtSec(left)]);
  if (bonus) stats.push(['ボーナス', `+${bonus}`]);
  renderResult({ st, idx: p.idx, score, cleared: win, firstClear, stats, msg, stars, gift, acc, pre: win ? ALIEN_LINES.lose : ALIEN_LINES.win });
}

/* ===== けっか（とくてん・じこベスト）：もじは すくなく、じこベストは ドーンと ===== */
let resultTok = 0;
function renderResult(o) {
  const { st, idx } = o, prev = Best.get(st.id), pb = o.score > prev && o.score > 0, my = ++resultTok;
  Best.set(st.id, o.score);
  const nIdx = nextOf(idx), nxt = nIdx >= 0 ? STAGES[nIdx] : null, opened = o.firstClear && nxt && !S.openAll && unlocked(nIdx);
  Sound.quiet(false); Sound.bgm(null); setTimeout(() => Sound.sfx(pb ? 'best' : o.cleared ? 'fanfare' : 'timeup'), 300); setTimeout(() => { if (my === resultTok && $('#againBtn')) Sound.bgm('map'); }, 3400);
  World.react(o.cleared ? 'happy' : 'sad'); play.i = play.queue ? play.queue.length : 0; renderDots();
  const news = o.gift ? short(o.gift) : opened ? `🔓 ${nxt.name}` : '';
  panel.innerHTML = `<div class="result">
    <span class="stamp" aria-hidden="true" ${o.cleared ? '' : 'style="filter:grayscale(1)"'}>${st.ic}<b>${o.cleared ? 'クリア' : 'もうすこし'}</b></span>
    <div class="score-big" aria-label="とくてん ${o.score}てん"><span id="scoreNum">0</span><small>てん</small></div>
    ${pb ? '<div class="pbx">じこベスト！</div>' : prev ? `<p class="bestline">ベスト ${prev}てん</p>` : ''}
    <p class="earn">★ +${o.stars}</p>
    ${news ? `<p class="gift">${news}</p>` : ''}
    <div class="row center">${opened ? '<button class="next" id="goNext">つぎへ ▶</button>' : ''}<button class="${opened ? 'pill' : 'next'}" id="againBtn">もういちど</button><button class="pill" id="backBtn">ちず</button></div></div>`;
  panel.scrollTop = 0;
  /* とくてんを いっきに かぞえあげる */
  const el = $('#scoreNum'), t0 = performance.now(), dur = 900;
  const up = now => { if (!el.isConnected) return; const k = Math.min(1, (now - t0) / dur); el.textContent = Math.round(o.score * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(up); };
  requestAnimationFrame(up); setTimeout(() => { if (el.isConnected) el.textContent = o.score; }, dur + 100);
  const words = o.msg + (o.gift ? ' ' + o.gift : '') + (pb ? ' じこベスト こうしん！ すごい！' : '') + (opened && !o.gift ? ` つぎの ステージ、${nxt.name}が ひらいたよ！` : '');
  (o.pre ? speak(o.pre, false, 'alien') : Promise.resolve()).then(() => { if (my === resultTok && $('#againBtn')) speak(words); });
  if (opened) $('#goNext').onclick = () => { Sound.sfx('tap'); mapWorld = worldOf(nIdx); S[posKey()] = WORLDS[mapWorld].indexOf(nIdx); save(); startStage(nIdx); };
  $('#againBtn').onclick = () => { Sound.sfx('tap'); startStage(idx); };
  $('#backBtn').onclick = () => { Sound.sfx('tap'); showMap(null, worldOf(idx)); };
}


/* ===== はじまり ===== */
function start() {
  if (!World.init($('#gl'), () => S.room)) $('#nogl').hidden = false;
  World.setWear(S.wear);
  $('#homeBtn').onclick = () => { Sound.sfx('tap'); Sound.quiet(false); Hint.close(); showMap(); };
  $('#sndBtn').onclick = () => { S.bgm = !S.bgm; save(); Sound.unlock(); Sound.bgmToggle(); $('#sndBtn').textContent = S.bgm ? '🔊' : '🔇'; };
  $('#sndBtn').textContent = S.bgm ? '🔊' : '🔇';
  $('#mRew').onclick = () => { Sound.sfx('tap'); showRewards('wear'); };
  $('#mSnd').onclick = () => { S.bgm = !S.bgm; save(); Sound.unlock(); Sound.bgmToggle(); $('#mSnd').textContent = S.bgm ? '🔊' : '🔇'; $('#sndBtn').textContent = $('#mSnd').textContent; };
  $('#mSet').onclick = () => { Sound.sfx('tap'); showSettings(); };
  $('#mWorld').onclick = () => { Sound.sfx('sparkle'); showMap(false, mapWorld === 'adv' ? 'town' : 'adv'); };
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!$('#map').hidden && !mapBusy) drawMap(curNext()); }, 200); });
  addEventListener('pointerdown', () => Voice.unlock(), { once: true });
  $('#mtFace').innerHTML = grinSVG('', true);
  if (TRIAL) { document.querySelector('.town').insertAdjacentHTML('beforeend', '<span class="trial-badge">たいけんばん</span>'); document.querySelector('.op-start').textContent = 'タップして はじめる（たいけんばん）'; }
  Opening.init();
}
start();
</script>
