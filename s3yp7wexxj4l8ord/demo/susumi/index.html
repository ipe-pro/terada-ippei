<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>【体験版】すすみノート 算数5年</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- v3：本文は Windows 標準の BIZ UDPGothic を使い、読み込むWebフォントは見出し用の1つ・1太さだけにする -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* v2：情報を「いまここ」中心に整理。背景とカードの差をはっきりさせ、1画面に1つのことだけ出す
   v3：軽さ（部分更新）・児童の操作のしやすさ・画面どうしのやりとり */
:root{
  --bg:#EAEFF6; --surface:#FFFFFF; --surface2:#F3F6FA; --line:#D9E0EB;
  --ink:#1B2437; --ink2:#4E5A71; --ink3:#838EA4;
  --accent:#2457C5; --accentSoft:#E3EAFB; --accentInk:#FFFFFF;
  --pen:#CF2F2A; --hl:#FFE56A;
  --ok:#23804F; --okSoft:#DDF1E5; --warn:#966300; --warnSoft:#FCEFC8; --bad:#C2410C; --badSoft:#FCE3D7;
  --shadow:0 1px 2px rgba(20,32,64,.06),0 3px 10px rgba(20,32,64,.06);
  --fd:'Zen Maru Gothic','BIZ UDPGothic','Hiragino Maru Gothic ProN',sans-serif;
  --fb:'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C111A; --surface:#182030; --surface2:#212A3B; --line:#2E394E;
  --ink:#E8EDF6; --ink2:#AAB4C8; --ink3:#78849B;
  --accent:#86A8FF; --accentSoft:#1F2C4C; --accentInk:#0C111A;
  --pen:#FF7B70; --hl:#5C4F12;
  --ok:#5BC48D; --okSoft:#153325; --warn:#E5B54A; --warnSoft:#362B0F; --bad:#FF8D5C; --badSoft:#3C2116;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C111A; --surface:#182030; --surface2:#212A3B; --line:#2E394E;
  --ink:#E8EDF6; --ink2:#AAB4C8; --ink3:#78849B;
  --accent:#86A8FF; --accentSoft:#1F2C4C; --accentInk:#0C111A;
  --pen:#FF7B70; --hl:#5C4F12;
  --ok:#5BC48D; --okSoft:#153325; --warn:#E5B54A; --warnSoft:#362B0F; --bad:#FF8D5C; --badSoft:#3C2116;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.7}
h1,h2,h3,h4{font-family:var(--fd);text-wrap:balance;margin:0;line-height:1.35}
h2{font-size:1.4rem} h3{font-size:1.1rem} h4{font-size:1rem}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .small{font-size:.86rem}
.hint{font-size:.86rem;color:var(--ink2)}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.ok-t{color:var(--ok);font-weight:700} .bad-t{color:var(--bad);font-weight:700}
.empty{color:var(--ink3);font-size:.9rem;padding:8px 0}

/* ヘッダー */
.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.3rem;color:var(--accent)}
.brand .unit{font-size:.86rem;color:var(--ink2)}
.lesson-pill{font-family:var(--fd);font-weight:700;font-size:.86rem;background:var(--hl);color:var(--ink);padding:1px 12px;border-radius:999px}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--accent);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 16px;font-weight:700;color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accentInk)}
.who{display:flex;align-items:center;gap:6px;font-size:.88rem}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px}
select:focus,input:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{width:100%;resize:vertical;min-height:90px}
.proto{font-size:.74rem;color:var(--ink3);border:1px dashed var(--ink3);border-radius:6px;padding:1px 8px}

/* 全体の配置 */
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 80px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px}
nav.tabs{display:flex;flex-direction:column;gap:4px;position:sticky;top:76px;align-self:start}
nav.tabs button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-family:var(--fd);font-weight:700;font-size:.98rem;color:var(--ink2)}
nav.tabs .ic{font-size:1.2rem;width:1.5em;text-align:center}
nav.tabs button:hover{background:var(--surface)}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--accentInk);box-shadow:var(--shadow)}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:14px;padding-top:12px}
  nav.tabs{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  nav.tabs button{flex:0 0 auto;white-space:nowrap;padding:8px 12px;font-size:.9rem;background:var(--surface)}
}
.pagehead{display:flex;align-items:center;gap:12px}
.pagehead .pic{font-size:1.8rem;line-height:1}
.pagehead p{color:var(--ink2);font-size:.92rem}

/* カード */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0;box-shadow:var(--shadow)}
.card > h3{margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.box > h4{margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}

/* ボタン・チップ */
.btn{border:1.5px solid var(--accent);background:var(--accent);color:var(--accentInk);border-radius:10px;padding:7px 16px;font-weight:700}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.sm{padding:3px 12px;font-size:.86rem;border-radius:8px}
.btn.big{padding:10px 22px;font-size:1.05rem}
.chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 13px;font-size:.9rem}
button.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accentInk);font-weight:700}
.tag{display:inline-block;font-size:.76rem;padding:0 9px;border-radius:6px;background:var(--surface2);color:var(--ink2);font-weight:700;font-family:var(--fb)}
.tag.k{background:var(--accentSoft);color:var(--accent)}
.tag.t{background:var(--warnSoft);color:var(--warn)}
.tag.s{background:var(--okSoft);color:var(--ok)}
.tag.mis{background:var(--badSoft);color:var(--bad)}
.sig{display:inline-flex;align-items:center;gap:5px;font-size:.84rem;font-weight:700;border-radius:999px;padding:1px 10px;white-space:nowrap}
.sig.green{color:var(--ok);background:var(--okSoft)} .sig.yellow{color:var(--warn);background:var(--warnSoft)} .sig.red{color:var(--bad);background:var(--badSoft)}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.dot.green{background:var(--ok)} .dot.yellow{background:var(--warn)} .dot.red{background:var(--bad)}
.no{display:inline-block;min-width:1.6em;color:var(--ink3);font-size:.82em;font-variant-numeric:tabular-nums}

/* ページ内の切りかえ */
.subtabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;box-shadow:var(--shadow)}
.subtabs button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;padding:8px 14px;font-family:var(--fd);font-weight:700;color:var(--ink2);white-space:nowrap}
.subtabs button:hover{background:var(--surface2)}
.subtabs button[aria-selected="true"]{background:var(--accentSoft);color:var(--accent)}

/* ひらく・とじる */
details.more{border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
details.more > summary{cursor:pointer;padding:9px 14px;font-weight:700;font-size:.92rem;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:8px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"▶";font-size:.7rem;color:var(--accent);transition:transform .15s}
details.more[open] > summary::before{transform:rotate(90deg)}
details.more > .in{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}

/* 分数 */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 2px;font-variant-numeric:tabular-nums}
.fr span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr span{font-size:.9em}

/* いまここ */
.nowcard{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:16px 20px;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:14px 28px;align-items:center;box-shadow:var(--shadow)}
@media (max-width:760px){.nowcard{grid-template-columns:1fr}}
.now-lbl{display:inline-block;font-family:var(--fd);font-weight:700;font-size:.82rem;background:var(--accent);color:var(--accentInk);border-radius:999px;padding:0 12px}
.now-step{display:flex;align-items:baseline;gap:8px;margin:4px 0 6px}
.now-num{font-family:var(--fd);font-weight:700;font-size:2.2rem;color:var(--accent);line-height:1}
.now-name{font-family:var(--fd);font-weight:700;font-size:1.45rem}
.now-sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:.84rem;border-radius:999px;padding:1px 11px;background:var(--surface2);color:var(--ink2);font-weight:700}
.stat{font-size:.84rem;border-radius:999px;padding:1px 11px;border:0;font-weight:700;background:var(--surface2);color:var(--ink2)}
.stat.bad{background:var(--badSoft);color:var(--bad)} .stat.ok{background:var(--okSoft);color:var(--ok)}
.stat:hover{text-decoration:underline}
ol.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr))}
.track li{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.track li::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:4px;background:var(--line);z-index:0}
.track li:first-child::before{display:none}
.track li.done::before,.track li.cur::before{background:var(--accent)}
.track .nd{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:700;background:var(--surface);border:2.5px solid var(--line);color:var(--ink3)}
.track li.done .nd{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.track li.cur .nd{border-color:var(--accent);color:var(--accent);background:var(--hl);transform:scale(1.18);box-shadow:0 0 0 4px var(--accentSoft)}
.track .sn{font-size:.7rem;color:var(--ink3);text-align:center;line-height:1.25;margin-top:4px;max-width:100%}
.track li.cur .sn{color:var(--ink);font-weight:700}
.track .flag{font-size:.68rem;font-weight:700;color:var(--pen);border:1.5px solid var(--pen);border-radius:5px;padding:0 4px;line-height:1.4}
@media (max-width:560px){.track .sn{display:none}.track .nd{width:30px;height:30px;font-size:.85rem}.track li::before{top:14px}}

/* きょうの流れ */
.flowbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.flowbar button{display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;font-family:var(--fd);font-weight:700;font-size:.86rem;color:var(--ink2);min-width:0}
.flowbar .fn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--ink2)}
.flowbar button.done .fn{background:var(--ok);color:#fff}
.flowbar button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accentInk);box-shadow:var(--shadow)}
.flowbar button[aria-current="step"] .fn{background:var(--accentInk);color:var(--accent)}
.flowbar .fl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (max-width:420px){.flowbar{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{padding:20px 22px}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pnum{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-family:var(--fd);font-weight:700}
.panel-h h3{font-size:1.25rem}
.panel-nav{display:flex;justify-content:space-between;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.lead{font-size:1rem;color:var(--ink2);margin-bottom:12px}

/* 1問テスト */
.quizbox{background:var(--surface2);border-radius:12px;padding:18px 20px}
.quizq{font-size:1.4rem;font-family:var(--fd);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ansbox{display:inline-flex;flex-direction:column;gap:3px;align-items:center}
.ansbox input{width:64px;text-align:center;padding:4px;font-size:1.15rem}
.ansbox hr{width:68px;border:0;border-top:2.5px solid var(--ink);margin:0}
.result{margin-top:14px;font-family:var(--fd);font-weight:700;font-size:1.1rem;border-radius:10px;padding:8px 14px}
.result.ok{background:var(--okSoft);color:var(--ok)} .result.bad{background:var(--badSoft);color:var(--bad)}
.minibox{background:var(--surface2);border-left:6px solid var(--hl);border-radius:0 12px 12px 0;padding:18px 20px;font-size:1.25rem;font-family:var(--fd);font-weight:700;line-height:1.7}

/* めあて */
.quote{border-left:4px solid var(--hl);padding:6px 12px;background:var(--surface2);border-radius:0 8px 8px 0;font-size:.92rem}
.gf-row{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.gf-row:first-of-type{border-top:0}
.gf-l{font-weight:700;font-size:.92rem;color:var(--ink2)}
@media (max-width:560px){.gf-row{grid-template-columns:1fr;gap:4px}}
input.big,select.big{font-size:1.05rem;padding:9px 12px}
input.big{width:100%}
.gf-preview{margin-top:10px;background:var(--accentSoft);border-radius:10px;padding:12px 14px;font-size:1.08rem}
.gf-preview .lbl{display:block;font-size:.8rem;color:var(--ink2)}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:16px;height:9px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--accent)}

/* 学習・丸つけ */
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.task:last-of-type{border-bottom:0}
.marks{display:inline-flex;gap:6px}
.marks button{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-family:var(--fd);font-weight:700;font-size:1.25rem;color:var(--ink3)}
.marks button[data-v="○"][aria-pressed="true"]{border-color:var(--ok);background:var(--okSoft);color:var(--ok)}
.marks button[data-v="△"][aria-pressed="true"]{border-color:var(--warn);background:var(--warnSoft);color:var(--warn)}
.marks button[data-v="✖"][aria-pressed="true"]{border-color:var(--bad);background:var(--badSoft);color:var(--bad)}
.sigbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.sigbtn{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-family:var(--fd);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.sigbtn .face{font-size:2.2rem;line-height:1.15}
.sigbtn{padding:10px 4px 8px}
.face{display:inline-block;font-size:1.05em;line-height:1;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
.sigbtn.green[aria-pressed="true"]{border-color:var(--ok);background:var(--okSoft);color:var(--ok)}
.sigbtn.yellow[aria-pressed="true"]{border-color:var(--warn);background:var(--warnSoft);color:var(--warn)}
.sigbtn.red[aria-pressed="true"]{border-color:var(--bad);background:var(--badSoft);color:var(--bad)}
.special{border:2px solid var(--accent);border-radius:12px;padding:12px 14px;background:var(--accentSoft)}
.special p{margin:6px 0}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tally > div{border-radius:12px;padding:10px;text-align:center;font-family:var(--fd);font-weight:700}
.tally b{display:block;font-size:1.6rem;line-height:1.2}
.tally .o{background:var(--okSoft);color:var(--ok)} .tally .t{background:var(--warnSoft);color:var(--warn)} .tally .x{background:var(--badSoft);color:var(--bad)}

/* 図鑑 */
.tips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.tips{grid-template-columns:1fr}}
.tip{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.tip-h{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tip .lineM{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px}
.pickb{background:var(--hl);color:var(--ink);font-size:.74rem;padding:0 8px;border-radius:5px;font-weight:700}
.like{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 10px;font-size:.84rem;align-self:flex-start}
.like[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accentSoft);font-weight:700}
.tf{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px 12px;align-items:center}

 red:c=>pick([`${MARU[c-1]}で通分する数がわからなくなった`,'ドリルで✖が続いて、どこがちがうのかわからない','最小公倍数の見つけ方がまだあやしい']),
 yellow:c=>pick([`${MARU[c-1]}の答え、約分できるか確かめ中`,'寺田問題の説明で、図と式をどうつなぐか考え中','教科書の例はわかったけど、ドリルだと手が止まる']),
 green:c=>pick([`${MARU[c-1]}の教科書が終わった。ドリルに入る`,'○が続いている。次は時間をはかってやってみる','通分のコツなら説明できそう'])};

function makeStudent(i){
  const ability=.45+R()*.55, pace=.7+R()*.6;
  let done=clamp(Math.round(pace*4.6+(R()-.5)),2,8);
  if([2,7,13].includes(i)){done=7;}
  const ab=[2,7,13].includes(i)?.95:ability;
  const planAt5=clamp(done+Math.round((R()-.35)*3),3,8);
  const plan=[0,1,2,3,4,5].map(t=>Math.round(planAt5*BASE[t]));
  plan.push(Math.min(8,Math.round(planAt5+(8-planAt5)/2)),8,8,8,8);
  const actual=[0,1,2,3,4,5].map(t=>Math.round(done*BASE[t]));
  const marks={};
  for(let n=1;n<=done;n++)for(let k=0;k<2;k++){const r=R();marks[n+'-'+k]=r<ab?'○':r<ab+(1-ab)*.6?'△':'✖'}
  if(done<8&&R()<.5)marks[(done+1)+'-0']=R()<ab?'○':'△';
  const mini={k:clamp(Math.round(70*(.5+.45*ab)+(R()-.5)*8),30,70),t:clamp(Math.round(30*(.3+.62*ab)+(R()-.5)*8),6,30)};
  const target=[80,85,90,95,100][Math.floor(R()*5)];
  const behind=actual[5]-plan[5];
  let signal=(behind<=-2||(R()<.3&&ab<.65))?'red':R()<.35?'yellow':'green';
  const cs=Math.min(8,done+1);
  const g=R();
  const refl=[];
  for(let t=0;t<=5;t++){
    const p=g*t/5+.1;
    let mPace,mAtt,text;
    if(t===0){mPace=`目標点${target}点`;mAtt=g>.6?pick(SPEC_ATT):pick(VAGUE_ATT);text=g>.5?`計画は1時間に1つ以上すすめる。前の単元はドリルを後回しにしたので、今回は先にやる。`:'がんばりたい。'}
    else if(t===4){mPace='ミニテストで弱点を見つける';mAtt=R()<p?'正直に丸つけをする':'がんばる';text=R()<p+.1?`ミニテストは知識${mini.k}/70、思考${mini.t}/30。${mini.t<20?'説明の問題が弱いので寺田問題で練習する。':'まちがえた約分をやり直す。'}`:'ミニテストがおわった。'}
    else{mPace=R()<p?`${MARU[clamp(plan[t],1,8)-1]}まで終わらせる`:'すすめる';mAtt=R()<p?pick(SPEC_ATT):pick(VAGUE_ATT);text=R()<p+.05?specR(actual[t]||1):pick(VAGUE_R)}
    refl.push({t,mPace,mAtt,text,strats:detect(mAtt+text)});
  }
  return {id:i,no:i+1,name:NAMES[i],ability:ab,marks,plan,actual,mini,target,signal,note:NOTE[signal](cs),
    terada:done>=5?{1:R()<.7?'提出':'取り組み中'}:{},challenges:[],teacherRole:false,refl,selfCheck:{},
    goal:null,todayMarks:[],reflDone:false,growthNote:'',planSaved:false,gWho:[],gTools:[],gOther:'',checkSeen:false,
    flow:null};
}
let students=NAMES.map((_,i)=>makeStudent(i));

   {t:3,mPace:'③を終わらせて④の教科書まで',mAtt:'わからなかったら3分考えてから聞く',text:'通分は最小公倍数を見つけるのがコツ。ゆいさんに聞いたら、大きい方の分母の倍数から調べるといいと教えてもらってできた。'},

   {t:5,mPace:'⑤を終わらせ、寺田問題①を出す',mAtt:'ホワイトボードで説明を3回する',text:'⑤終了。寺田問題で1/2+1/3を図で説明した。ホワイトボードでそうたさんに説明したら「なんで6にするの」と聞かれて、最小公倍数の話を足したら伝わった。説明すると自分もわかる。'}
  ].map(r=>({...r,strats:detect(r.mAtt+r.text)}));

/* ===== 計算ヘルパー ===== */
const doneOf=s=>{let d=0;for(let n=1;n<=8;n++){if(s.marks[n+'-0']&&s.marks[n+'-1'])d=n;else break}return d};
const curStep=s=>Math.min(8,doneOf(s)+1);
function counts(s){const c={'○':0,'△':0,'✖':0};Object.values(s.marks).forEach(m=>c[m]++);return c}
const okRate=s=>{const c=counts(s),n=c['○']+c['△']+c['✖'];return n?c['○']/n:0};
const gapOf=s=>doneOf(s)-s.plan[5];
const canTeach=s=>{const r=[];for(let n=1;n<=8;n++)if(s.marks[n+'-0']==='○'&&s.marks[n+'-1']==='○')r.push(n);return r};
const isACand=s=>doneOf(s)>=6&&okRate(s)>=.7&&s.mini.t>=21;
const triedSteps=s=>{const r=[];for(let n=1;n<=8;n++)if(s.marks[n+'-0']||s.marks[n+'-1'])r.push(n);return r};

/* ===== 児童：きょうの学習（4つの場面を切りかえる）
   1問テストとミニ授業は先生が毎時間その場で出すので、児童の画面には入れない（記録は教師の「授業の記録」へ） ===== */
const FLOW=[['goal','めあて'],['work','学習'],['check','丸つけ'],['refl','振り返り']];
function flowDone(s,id){return {goal:!!s.goal,work:s.todayMarks.length>0,check:!!s.checkSeen,refl:s.reflDone}[id]}
const curFlow=s=>s.flow||(FLOW.find(([id])=>!flowDone(s,id))||FLOW[FLOW.length-1])[0];
function vToday(s){
  const f=curFlow(s);
  return vNow(s)+`<nav class="flowbar" aria-label="きょうの流れ">${FLOW.map(([id,l],i)=>{const dn=flowDone(s,id);return `<button data-act="flow" data-v="${id}" class="${dn?'done':''}" ${id===f?'aria-current="step"':''}><span class="fn">${dn?'✓':i+1}</span><span class="fl">${l}</span></button>`}).join('')}</nav>`
   +({goal:pGoal,work:pWork,check:pCheck,refl:pRefl}[f])(s);
}
function panel(id,tag,body){
  const i=FLOW.findIndex(f=>f[0]===id),last=FLOW.length-1;
  return `<section class="card panel"><div class="panel-h"><span class="pnum">${i+1}</span><h3>${FLOW[i][1]}</h3>${tag?`<span class="tag">${tag}</span>`:''}</div>${body}

}
/* めあて：だれと・何を使っては複数えらべる。「もしも」のときの手立ても先に決めておく */
const IFS=[
 {k:'ifFocus',ic:'😵',q:'もし、集中が切れてしまったら？',ph:'例：タイマーで5分ずつ区切って、1問ずつ進める',ch:['タイマーで区切る','少し体を動かす','場所をかえる','友だちと問題を出し合う']},
 {k:'ifLost',ic:'🤔',q:'もし、わからなくなってしまったら？',ph:'例：3分考えて、教科書の例を見てから友だちに聞く',ch:['3分考える','教科書の例を見る','コツ図鑑を見る','友だちに聞く','先生に聞く']},
 {k:'ifLate',ic:'🐢',q:'もし、進度が遅れていたら？',ph:'例：ドリルは家で2問やって、次の時間に追いつく',ch:['計画を見直す','休み時間に少しやる','家でドリルをやる','教えてもらって進める']}];

  return panel('goal','',`
   ${last?`<div class="quote" style="margin-bottom:14px"><b>前の時間のわたし：</b>${reflHTML(last)}</div>`:''}
   <div class="stack">
    <div class="box"><h4><span class="tag k">進度</span>きょうは、どこまで進む？</h4>
     <div class="row"><select id="gStep" class="big" aria-label="どこまで">${STEPS.map((_,i)=>`<option value="${i+1}" ${gStep===i+1?'selected':''}>${stepLbl(i+1)}</option>`).join('')}</select><span>まで</span><span class="hint">（あと${Math.max(0,gStep-d)}ステップ）</span></div>
    </div>
    <div class="box"><h4><span class="tag s">学び方</span>どうやって進める？ <span class="hint" style="font-weight:400">いくつえらんでもOK</span></h4>

     <div class="gf-row"><span class="gf-l">何を使って</span><div class="row">${TOOLS.map(w=>`<button class="chip" data-act="gTool" data-v="${w}" aria-pressed="${s.gTools.includes(w)}">${w}</button>`).join('')}
      ${hasOther?`<input type="text" id="gOther" data-enter="saveGoal" style="flex:1;min-width:160px" placeholder="その他：何を使う？" value="${esc(other)}">`:''}</div></div>
     <div class="gf-row"><label class="gf-l" for="gHow">どうする</label><input type="text" id="gHow" data-enter="saveGoal" class="big" placeholder="例：✖の問題と同じ形を3問出し合う" value="${esc(how)}"></div>
     <div class="gf-preview"><span class="lbl">わたしの学び方のめあて</span><b id="gPrev">${esc(att)||'<span class="muted" style="font-weight:400">上でえらぶと、ここに文ができます</span>'}</b>
      <div class="small muted" style="margin-top:6px">具体さ <span id="mAtt">${meter(conc(att))}</span>　人・もの・数が入ると上がるよ</div></div>
    </div>
    <div class="box"><h4><span class="tag t">もしも</span>こまったときは、どうする？ <span class="hint" style="font-weight:400">ボタンをおすと文に入るよ</span></h4>
     ${IFS.map(x=>{const v=fv(x.k,g?.ifs?.[x.k]||'');return `<div class="ifq"><label class="ifq-q" for="${x.k}"><span aria-hidden="true">${x.ic}</span> ${x.q}</label>

}
function taskRows(n){

    ${det('tipsHere',`💡 ${MARU[cs-1]}のコツ・まちがい（${tipsHere.length}件）`,(tipsHere.slice(0,3).map(t=>tipCard(t)).join('')||'<p class="empty">まだ投稿がありません。</p>')+`<button class="btn sm ghost" style="align-self:flex-start" data-act="tab" data-v="tips">図鑑をぜんぶ見る →</button>`)}

/* 丸つけ：数を入力させるのではなく、丸つけのしかたを確かめる */

/* 振り返り：＋（できたこと）−（できなかったこと・丸つけからわかったこと）→（次の時間にどうするか） */

 {k:'rMinus',m:'−',cls:'m',l:'できなかったこと（丸つけからわかったことも）',ph:'例：ドリルで✖が2つ。原因は約分のわすれ'},

/* ===== 計画（児童・教師共通） ===== */
function planChart(s){
  const W=600,H=230,L=40,Rr=16,T=14,B=34,cw=(W-L-Rr)/10,yh=(H-T-B)/8;
  const X=t=>L+t*cw,Y=v=>T+(8-v)*yh;
  const act=[...s.actual];act.push(doneOf(s));
  let g='';
  for(let v=0;v<=8;v++)g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11">${v?MARU[v-1]:'0'}</text>`;
  for(let t=0;t<=10;t++)g+=`<text x="${X(t)}" y="${H-12}" text-anchor="middle" font-size="11">${t}</text>`;
  g+=`<rect x="${X(NOW)-cw/2}" y="${T}" width="${cw}" height="${H-T-B}" fill="var(--accentSoft)"/>`;
  g+=`<polyline fill="none" stroke="var(--ink3)" stroke-width="2" stroke-dasharray="5 4" points="${s.plan.map((v,t)=>X(t)+','+Y(v)).join(' ')}"/>`;
  g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="3" points="${act.map((v,t)=>X(t)+','+Y(v)).join(' ')}"/>`;
  act.forEach((v,t)=>g+=`<circle cx="${X(t)}" cy="${Y(v)}" r="${t===act.length-1?5.5:3.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`);
  g+=`<text x="${W-Rr}" y="${H-1}" text-anchor="end" font-size="10">時</text>`;
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;min-width:440px" role="img" aria-label="計画と実際の進度のグラフ">${g}</svg></div>
   <div class="legend"><span><svg width="26" height="8"><line x1="0" x2="26" y1="4" y2="4" stroke="var(--ink3)" stroke-width="2" stroke-dasharray="5 4"/></svg> 計画</span><span><svg width="26" height="8"><line x1="0" x2="26" y1="4" y2="4" stroke="var(--accent)" stroke-width="3"/></svg> 実際</span><span><span class="sw" style="background:var(--accentSoft)"></span>きょう</span></div>`;
}
function planAdvice(s,key){
  const d=doneOf(s),gap=gapOf(s),need=8-d,per=need/2;
  const h=need===0?'必須課題はぜんぶ終わり！':gap<0?`計画より ${-gap}ステップ おくれているよ`:gap>0?`計画より ${gap}ステップ 先に進んでいるよ`:'ここまで計画どおり！';
  const pace=need===0?'寺田問題や発展チャレンジ、復習の計画を立てよう。':`のこり <b>${need}ステップ</b>。第7時までに終えるには、1時間に <b>${per.toFixed(1)}ステップ</b>。${per>2?'第8時の復習の時間も使うか、学び方を変えよう。':per>1.5?'少しがんばればとどくよ。':'よゆうがあるよ。'}`;
  const mk=[];
  if(s.mini.k<56)mk.push('知識・技能：ミニテストで✖だった問題と同じステップのドリルをやり直す');
  if(s.mini.t<20)mk.push('思考・判断・表現：寺田問題を使って、図と式で説明する練習を計画に入れる');
  if(!mk.length)mk.push('ミニテストは目標に近いです。説明の質を上げる発展チャレンジもねらえます');
  return `<div class="advice ${gap>=0?'ok':''}"><span class="adv-h">${h}</span><p>${pace}</p>
   ${det(key,`ミニテストの分析から（知識 ${s.mini.k}/70・思考 ${s.mini.t}/30）`,`<ul>${mk.map(x=>`<li>${x}</li>`).join('')}</ul>`)}</div>`;
}
function vPlanBody(s,editable){
  const act=[...s.actual,doneOf(s)],key=editable?'plan':'tplanv',v=sub(key,'chart');
  const body=v==='chart'?`<div class="card">${planChart(s)}</div>`
   :`<div class="card"><div class="tbl-wrap"><table class="pt"><thead><tr><th></th>${LESSONS.map(l=>`<th class="${l.t===NOW?'now':''}">第${l.t}時<br><span class="muted">${l.k}</span></th>`).join('')}</tr></thead><tbody>
    <tr><th>計画</th>${s.plan.map((x,t)=>`<td class="${t===NOW?'now':''}">${editable&&t>=NOW?`<select data-chg="plan" data-t="${t}" aria-label="第${t}時の計画">${[0,1,2,3,4,5,6,7,8].map(o=>`<option value="${o}" ${o===x?'selected':''}>${o?MARU[o-1]:'—'}</option>`).join('')}</select>`:(x?MARU[x-1]:'—')}</td>`).join('')}</tr>
    <tr><th>実際</th>${s.plan.map((_,t)=>`<td class="${t===NOW?'now':''}">${t<act.length?(act[t]?MARU[act[t]-1]:'—'):''}</td>`).join('')}</tr>
   </tbody></table></div>
   ${editable?`<p class="hint" style="margin-top:8px">第${NOW}時から先は、えらんで変えられます。</p><div class="row" style="margin-top:10px"><button class="btn ghost" data-act="planAuto">ヒントどおりに組み直す</button><button class="btn" data-act="planSave">この計画で決める</button>${s.planSaved?'<span class="ok-t small">✓ 保存しました</span>':''}</div>`:`<p class="hint" style="margin-top:10px">${s.planSaved?'第6時に見直し済み':'まだ見直していません'}</p>`}</div>`;
  return planAdvice(s,key+'-adv')+subtabs(key,[['chart','グラフで見る'],['table',editable?'計画表をなおす':'計画表']])+body;
}

function growthChart(rs){
  const W=600,H=200,L=34,Rr=40,T=14,B=30,n=rs.length,cw=(W-L-Rr)/n;
  const maxLen=Math.max(80,...rs.map(r=>r.text.length));
  const Yc=v=>T+(4-v)*((H-T-B)/4),Yl=v=>T+(1-v/maxLen)*(H-T-B);
  let g='';
  for(let v=0;v<=4;v++)g+=`<line x1="${L}" x2="${W-Rr}" y1="${Yc(v)}" y2="${Yc(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Yc(v)+4}" text-anchor="end" font-size="11">${v}</text>`;
  g+=`<text x="${W-Rr+8}" y="${Yl(maxLen)+4}" font-size="11">${maxLen}字</text><text x="${W-Rr+8}" y="${Yl(0)+4}" font-size="11">0字</text>`;
  rs.forEach((r,i)=>{const c=conc(r.mPace+' '+r.mAtt),x=L+i*cw+cw*.2;g+=`<rect x="${x}" y="${Yc(c)}" width="${cw*.6}" height="${Yc(0)-Yc(c)}" rx="3" fill="var(--accentSoft)" stroke="var(--accent)"/><text x="${L+i*cw+cw/2}" y="${H-10}" text-anchor="middle" font-size="11">第${r.t}時</text>`});
  g+=`<polyline fill="none" stroke="var(--pen)" stroke-width="2.5" points="${rs.map((r,i)=>(L+i*cw+cw/2)+','+Yl(r.text.length)).join(' ')}"/>`;
  rs.forEach((r,i)=>g+=`<circle cx="${L+i*cw+cw/2}" cy="${Yl(r.text.length)}" r="${i===n-1?5:3.5}" fill="var(--pen)" stroke="var(--surface)" stroke-width="1.5"/>`);
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;min-width:440px" role="img" aria-label="めあての具体さと振り返りの文字数">${g}</svg></div>
  <div class="legend"><span><span class="sw" style="background:var(--accentSoft);border:1px solid var(--accent)"></span>めあての具体さ（0〜4）</span><span><svg width="26" height="8"><line x1="0" x2="26" y1="4" y2="4" stroke="var(--pen)" stroke-width="2.5"/></svg> 振り返りの文字数</span></div>`;
}

/* ===== 描画 =====
   画面全体を innerHTML で作り直すのをやめ、変わったところだけを書きかえる（morph）。
   入力中の文字・カーソル・スクロール位置が消えず、古いPCでも軽い。 */
function morphKids(a,b){
  const ac=[...a.childNodes],bc=[...b.childNodes];
  bc.forEach((n,i)=>{if(i<ac.length)morph(ac[i],n);else a.appendChild(n)});
  for(let i=bc.length;i<ac.length;i++)ac[i].remove();
}
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  for(const {name} of [...a.attributes])if(!b.hasAttribute(name))a.removeAttribute(name);
  for(const {name,value} of [...b.attributes])if(a.getAttribute(name)!==value)a.setAttribute(name,value);
  const tag=a.nodeName,focused=a===document.activeElement;
  if(tag==='TEXTAREA'){if(!focused&&a.value!==b.value)a.value=b.value;return}
  if(tag==='INPUT'){if(!focused&&a.value!==b.value)a.value=b.value;return}
  morphKids(a,b);
  if(tag==='SELECT'&&!focused){const o=b.querySelector('option[selected]');a.value=o?o.value:(a.options[0]?.value??'')}
}
let rq=0;
/* 何回よばれても1回だけ描く（うしろのタブは rAF が止まることがあるので、setTimeout でも予約する） */

     :{class:vTClass,lesson:vTLesson,voice:vTVoice,plan:vTPlan,adv:vTAdv,growth:vTGrowth}[state.ttab]();
    const zt=state.zoom!=null&&db.tips.find(x=>x.id===state.zoom);

  }

  morphKids(document.getElementById('app'),t);
}
/* 通知は画面を描き直さずに出す（入力中の文字が消えないように） */

   case 'saveGoal':{const how=val('gHow');s.gOther=val('gOther').trim()||s.gOther;const ifs={};IFS.forEach(x=>ifs[x.k]=val(x.k).trim());

     s.goal={step:+val('gStep'),pace:'',how,att:composeAtt(s,how),ifs};s.flow='work';logEv(`${s.name}：めあて「${MARU[s.goal.step-1]}まで」`);top0();toast('めあてを決めました。②学習をはじめよう！');break}

   case 'useful':{const t=db.tips.find(x=>x.id===+el.dataset.id),i=t.usefulBy.indexOf(state.me);
     if(i<0){t.usefulBy.push(state.me);send(idOf(t.who),`👍 ${s.name}さんが、あなたの${t.kind}（${tipStep(t.step)}）を「役に立った」って`)}else t.usefulBy.splice(i,1);break}
   case 'pick':{const t=db.tips.find(x=>x.id===+el.dataset.id);t.pick=!t.pick;if(t.pick)send(idOf(t.who),`⭐ あなたの${t.kind}（${tipStep(t.step)}）が「先生おすすめ」になりました`);break}
   case 'mark':{const k=el.dataset.k,cur=s.marks[k],before=doneOf(s);
     if(cur===v){delete s.marks[k];s.todayMarks=s.todayMarks.filter(x=>x!==k)}else{s.marks[k]=v;if(!s.todayMarks.includes(k))s.todayMarks.push(k)}
     const after=doneOf(s),[n,tk]=k.split('-');
     if(cur!==v)logEv(`${s.name}：${MARU[n-1]}${TASKS[tk]} ${v}`);
     if(after>before){logEv(`${s.name}：${MARU[after-1]} クリア`);toast(after===8?'🎉 ①〜⑧ ぜんぶクリア！ 寺田問題やチャレンジに進もう':`🎉 ${MARU[after-1]} クリア！ つぎは ${MARU[after]} ${STEPS[after]}`)}
     break}
   case 'terada':s.terada[v]=s.terada[v]?'提出':'取り組み中';logEv(`${s.name}：${TERADA[v].title} ${s.terada[v]}`);toast(s.terada[v]==='提出'?'提出しました':'取り組み中にしました');break;
   case 'sig':if(s.signal!==v){s.signal=v;logEv(`${s.name}：いまの自分「${SIG[v]}」`);toast(`「${SIG[v]}」をみんなと先生に知らせたよ`)}break;
   case 'note':s.note=val('noteIn').trim();clearForm('noteIn');logEv(`${s.name}：「${s.note}」`);toast('みんなと先生に共有しました');break;
   case 'saveRefl':{const plus=val('rPlus').trim(),minus=val('rMinus').trim(),next=val('rNext').trim();
     if(!plus&&!minus){toast('「＋」か「−」を書こう');document.getElementById('rPlus')?.focus();return}
     if(!next){toast('「→ 次の時間にどうするか」も書こう');document.getElementById('rNext')?.focus();return}
     clearForm('rPlus','rMinus','rNext');
     const g=s.goal||{step:curStep(s),pace:'',att:''},t=[plus&&'＋'+plus,minus&&'−'+minus,'→'+next].filter(Boolean).join(' ');
     const r={t:NOW,mPace:g.pace||stepLbl(g.step)+'まで',mAtt:g.att||'—',text:t,plus,minus,next,strats:detect(g.att+t)};
     s.refl=s.refl.filter(x=>x.t!==NOW);s.refl.push(r);s.reflDone=true;logEv(`${s.name}：振り返りを出した`);toast('振り返りを出しました');break}
   case 'self':s.selfCheck[el.dataset.c]=v;break;
   case 'sort':state.sortAns[el.dataset.i]=v;break;
   case 'planAuto':{const d=doneOf(s),need=8-d;s.plan[6]=Math.min(8,d+Math.ceil(need/2));s.plan[7]=s.plan[8]=s.plan[9]=s.plan[10]=8;s.planSaved=false;toast('第6・7時で⑧まで終える計画にしました');break}
   case 'planSave':s.planSaved=true;logEv(`${s.name}：計画を見直した`);toast('計画の見直しを保存しました');break;
   case 'gNote':s.growthNote=val('gNote');clearForm('gNote');toast('保存しました');break;
   case 'post':{const t=val('pText').trim();if(!t){toast('内容を書いてからのせよう');return}clearForm('pText');
     const kind=val('pKind');db.board.unshift({id:uid(),who:s.name,step:+val('pStep'),kind,text:t,like:0,likedBy:[],replies:[]});
     logEv(`${s.name}：ボードに${kind}「${t}」`);if(kind==='質問')send('T',`❓ ${s.name}さんの質問：${t}`);break}
   case 'like':{const p=db.board.find(x=>x.id===el.dataset.id),i=p.likedBy.indexOf(state.me);
     if(i<0){p.likedBy.push(state.me);send(idOf(p.who),`💡 ${s.name}さんが、あなたの${p.kind}に「なるほど」`)}else p.likedBy.splice(i,1);break}
   case 'reply':{const id=el.dataset.id,p=db.board.find(x=>x.id===id),t=val('rp-'+id).trim();if(!t){toast('へんじを書いてからおそう');return}
     clearForm('rp-'+id);const who=me==='T'?'先生':s.name;p.replies.push({who,text:t});
     send(idOf(p.who),`💬 ${who}${me==='T'?'':'さん'}が、あなたの${p.kind}にへんじ：${t}`);logEv(`${who}：「${p.text.slice(0,12)}…」にへんじ`);break}
   case 'callT':{if(openCall(s.id))return;db.calls.push({id:uid(),from:s.id,to:'T',step:curStep(s),note:s.note,status:'open',at:Date.now()});
     if(s.signal!=='red')s.signal='red';logEv(`${s.name}：🙋 先生をよんだ`);toast('先生に知らせたよ。待つあいだは教科書の例を読みなおそう');break}
   case 'callKid':{const x=+el.dataset.i;if(openCall(s.id)){toast('いまのよびだしが終わってから、つぎの人をよぼう');return}
     db.calls.push({id:uid(),from:s.id,to:x,step:curStep(s),note:s.note,status:'open',at:Date.now()});
     logEv(`${s.name}：${students[x].name}さんに「教えて」`);toast(`${students[x].name}さんに「教えて」をとどけたよ`);break}
   case 'offer':{const x=+el.dataset.i;if(openCall(x))return;
     db.calls.push({id:uid(),from:x,to:s.id,step:curStep(students[x]),note:students[x].note,status:'coming',at:Date.now()});
     send(x,`🏃 ${s.name}さんが教えに来てくれるよ！`);logEv(`${s.name}：${students[x].name}さんに教えに行く`);toast(`${students[x].name}さんに「行くよ」と伝えたよ`);break}
   case 'callGo':{const c=db.calls.find(x=>x.id===el.dataset.id);if(!c)return;c.status='coming';
     send(c.from,`🏃 ${me==='T'?'先生':s.name+'さん'}が来てくれるよ！`);logEv(`${me==='T'?'先生':s.name}：${students[c.from].name}さんのところへ`);break}
   case 'callNo':{const c=db.calls.find(x=>x.id===el.dataset.id);if(!c)return;c.status='declined';
     send(c.from,`🙏 ${s.name}さんは、いま手がはなせないみたい。ほかの人か先生にきいてみよう`);break}
   case 'callDone':{const c=db.calls.find(x=>x.id===el.dataset.id);if(!c)return;c.status='done';
     if(c.from===me){if(c.to!=='T')send(c.to,`😊 ${s.name}さんから「ありがとう！ 解決したよ」`);toast('解決してよかったね！ わかったことを図鑑にのせると、みんなの助けになるよ')}
     else{if(me!=='T')logEv(`${s.name}：${students[c.from].name}さんに教えた`);send(c.from,`✅ ${me==='T'?'先生':s.name+'さん'}との相談がおわりました`)}break}
   case 'callCancel':{const c=db.calls.find(x=>x.id===el.dataset.id);if(c)c.status='canceled';break}
   case 'openKid':state.me=+el.dataset.i;state.mode='student';ss.set('mode','student');ss.set('me',String(state.me));loadForm();state.tab='today';state.inbox=false;top0();toast(students[state.me].name+'さんの画面を開きました');break;
   case 'saveLesson':{const t=+v,r={};['quiz','ans','ok','mini','memo'].forEach(k=>{r[k]=val('l'+k+'-'+t).trim();delete state.form['l'+k+'-'+t]});keepForm();db.lessons[t]=r;toast(`第${t}時の記録を保存しました`);break}
   case 'lPick':state.form.lSel=v;keepForm();top0();break;
   case 'zoom':state.zoom=+el.dataset.id;break;
   case 'unzoom':state.zoom=null;break;
   case 'tImgDel':clearForm('tImgData');break;
   case 'planRow':state.planSel=+el.dataset.i;break;
   case 'assign':{const k=students[+el.dataset.i],id=val('ch-'+k.id);if(id&&!k.challenges.includes(id)){k.challenges.push(id);clearForm('ch-'+k.id);send(k.id,`⭐ 先生からチャレンジ「${CH.find(c=>c.id===id).title}」がとどきました。②学習で見てね`);toast(k.name+'さんに渡しました')}break}
   case 'role':{const k=students[+el.dataset.i];k.teacherRole=!k.teacherRole;if(k.teacherRole)send(k.id,'🎓 きょうは先生役をおねがいします。「こまった」の友だちを助けてね');break}
   case 'tSel':state.tSel=+el.dataset.i;break;
   case 'stamp':case 'stampTxt':{const k=students[+el.dataset.i],r=k.refl[k.refl.length-1],t=a==='stamp'?v:val('tc-'+k.id).trim();if(!t)return;
     r.tc=t;if(a==='stampTxt')clearForm('tc-'+k.id);send(k.id,`💬 第${r.t}時の振り返りに先生から：${t}`);toast(k.name+'さんに送りました');break}
  }
  render();
}
/* 操作の直前に最新を読み、変わったときだけ保存して、ほかの画面へ知らせる */
function run(el){pull();act(el);if(save())markSeen()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el)run(el)});
/* Enter で決定（日本語入力の変換中は反応しない） */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.keyCode===229)return;
  const go=e.target.dataset?.enter;if(!go)return;
  e.preventDefault();
  if(go.startsWith('#')){document.querySelector(go)?.focus();return}
  const id=e.target.dataset.id,i=e.target.dataset.i;
  const btn=document.querySelector(`button[data-act="${go}"]${id?`[data-id="${id}"]`:''}${i?`[data-i="${i}"]`:''}`);
  if(btn)run(btn);
});
/* 写真は長い辺を720pxにちぢめてJPEGにする（保存の容量と通信を軽くするため） */
function shrink(file){return new Promise((ok,ng)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,720/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.7))};
  img.onerror=()=>{URL.revokeObjectURL(u);ng()};img.src=u})}
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.type==='file'){const f=el.files?.[0];if(!f)return;shrink(f).then(d=>{state.form.tImgData=d;keepForm();render()}).catch(()=>toast('この写真は読みこめませんでした'));return}
  if(el.id){state.form[el.id]=el.value;keepForm()}
  if(el.dataset?.chg==='lSel'){render();return}
  const c=el.dataset?.chg;if(!c)return;
  if(c==='plan'){pull();students[state.me].plan[+el.dataset.t]=+el.value;students[state.me].planSaved=false;save();render()}
  if(c==='tipFilter'&&el.value!==''){state.tipFilter=el.value;render()}
});
document.addEventListener('input',e=>{
  const id=e.target.id;if(!id)return;
  state.form[id]=e.target.value;keepForm();
  if(id==='gHow'){const t=composeAtt(students[state.me],e.target.value,fv('gOther',students[state.me].gOther));document.getElementById('gPrev').textContent=t||'上でえらぶと、ここに文ができます';document.getElementById('mAtt').innerHTML=meter(conc(t))}
  if(/^(rPlus|rMinus|rNext|ifFocus|ifLost|ifLate|gOther)$/.test(id))render();
});
/* 「ひらく」の開け閉めを覚えておく */
document.addEventListener('toggle',e=>{const k=e.target.dataset?.open;if(k)state.open[k]=e.target.open},true);
/* ほかの画面（タブ・ウィンドウ）が保存したら、すぐ描き直す */
window.addEventListener('storage',e=>{if(e.key===STORE&&pull()){announce();render()}});
/* 「〇分前」の表示を1分ごとに更新 */
setInterval(()=>{if(document.visibilityState==='visible')render()},60000);

if(!pull())save();
markSeen();loadForm();
render();
</script>
